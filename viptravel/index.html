<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VIP Travel Official — Turlar | Toshkent</title>
<meta name="description" content="VIP Travel Official — shaxsiy va korporativ sayohatlar, 6 ta filial 24/7 aloqa. Toshkent, O'zbekiston.">
<meta name="theme-color" content="#060810">
<style>
:root{
  --bg:#060810; --card:#10121a; --line:rgba(255,255,255,.08);
  --tx:#f4f5f8; --mut:#9aa0b4;
  --a:#c8952a; --b:#ffe08a; --c:#5aa9ff;
  --grad:linear-gradient(120deg,var(--a),var(--b));
  --r:22px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden;min-height:100vh}
#fx{position:fixed;inset:0;z-index:0;width:100%;height:100%}
.glow{position:fixed;z-index:0;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.25;pointer-events:none;animation:float 14s ease-in-out infinite alternate}
.g1{background:var(--a);top:-25vmax;left:-20vmax}
.g2{background:var(--c);bottom:-30vmax;right:-25vmax;animation-delay:-7s;opacity:.16}
@keyframes float{to{transform:translate(8vmax,6vmax) scale(1.15)}}
main{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:28px 18px 120px}

/* HERO */
.hero{text-align:center;padding-top:10px}
.logo{width:112px;height:112px;margin:0 auto 18px;border-radius:50%;position:relative;display:grid;place-items:center;
  background:conic-gradient(from 0deg,var(--a),var(--b),var(--c),var(--a));animation:spin 6s linear infinite}
.logo::before{content:"";position:absolute;inset:4px;border-radius:50%;background:#0b0d14}
.logo span{position:relative;font-weight:900;font-size:34px;letter-spacing:-1px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;animation:spinr 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
.logo::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:1px solid rgba(232,184,58,.5);animation:pulse 2.4s ease-out infinite}
@keyframes pulse{from{transform:scale(.9);opacity:1}to{transform:scale(1.35);opacity:0}}
h1{font-size:clamp(34px,10vw,46px);font-weight:900;letter-spacing:-1.5px;line-height:1.05}
h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.handle{color:var(--mut);margin-top:6px;font-size:15px}
.type{margin-top:14px;font-size:18px;min-height:28px;color:#dfe2ee;font-weight:600}
.type::after{content:"|";color:var(--a);animation:blink 1s steps(1) infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}

/* ROAD SCENE */
.road{position:relative;height:96px;margin:26px -18px 6px;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.road .asf{position:absolute;left:0;right:0;height:3px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.4) 0 40px,transparent 40px 130px);animation:dash 1.4s linear infinite}
.road .c1{top:18px}.road .c2{top:44px;animation-duration:.9s;opacity:.6}.road .c3{top:72px;animation-duration:1.9s;opacity:.35}

@keyframes dash{to{background-position:-130px 0}}
.car{position:absolute;left:50%;top:10px;width:180px;margin-left:-90px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(6px) rotate(-2deg)}}
.beam{position:absolute;left:100%;top:34px;width:120px;height:34px;background:linear-gradient(90deg,rgba(255,220,140,.55),transparent);clip-path:polygon(0 30%,100% 0,100% 100%,0 70%);animation:flick 3s infinite}
@keyframes flick{0%,92%,100%{opacity:1}94%{opacity:.4}96%{opacity:1}}
.wheel{transform-box:fill-box;transform-origin:center;animation:spin .5s linear infinite}

/* CTA BUTTONS */
.links{display:grid;gap:12px;margin-top:20px}
.btn{position:relative;display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:18px;text-decoration:none;color:var(--tx);
  background:var(--card);border:1px solid var(--line);overflow:hidden;font-weight:700;transition:transform .25s,border-color .25s,box-shadow .25s}
.btn::before{content:"";position:absolute;inset:0;background:var(--grad);opacity:0;transition:opacity .3s}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.22),transparent);transform:skewX(-20deg);animation:shine 4s ease-in-out infinite}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
.btn:hover,.btn:active{transform:translateY(-3px) scale(1.01);border-color:transparent;box-shadow:0 14px 34px -10px rgba(232,184,58,.55)}
.btn:hover::before,.btn:active::before{opacity:1}
.btn>*{position:relative;z-index:1}
.ico{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.07)}
.ico svg{width:22px;height:22px;fill:currentColor}
.btn small{display:block;color:var(--mut);font-weight:500;font-size:13px;transition:color .3s}
.btn:hover small{color:rgba(0,0,0,.65)}
.btn:hover{color:#1a1204}
.btn .arr{margin-left:auto;font-size:20px;transition:transform .25s}
.btn:hover .arr{transform:translateX(4px)}
.btn.main{background:var(--grad);color:#1a1204;border:0;padding:20px 18px;font-size:18px;box-shadow:0 16px 40px -12px rgba(232,184,58,.7)}
.btn.main .ico{background:rgba(0,0,0,.14)}
.btn.main small{color:rgba(0,0,0,.65)}
.btn.main::before{display:none}
.btn.main{animation:heart 2.2s ease-in-out infinite}
@keyframes heart{50%{transform:scale(1.025)}}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row2 .btn{flex-direction:column;align-items:flex-start;gap:10px}
.row2 .arr{display:none}
.row2 .btn:only-child{grid-column:1/-1;flex-direction:row;align-items:center}

/* SECTIONS */
section{margin-top:44px}
.h2{display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);margin-bottom:16px}
.h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:18px 8px;text-align:center;border-radius:var(--r);background:var(--card);border:1px solid var(--line)}
.stat b{display:block;font-size:30px;font-weight:900;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{font-size:12px;color:var(--mut)}

.svc{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.s{padding:18px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);transition:transform .3s,border-color .3s;transform-style:preserve-3d}
.s:hover{border-color:rgba(232,184,58,.6)}
.s i{font-style:normal;font-size:28px;display:block;margin-bottom:8px}
.s b{display:block;font-size:15px}
.s p{font-size:13px;color:var(--mut);margin-top:2px}

/* BRANCHES */
.br{display:grid;gap:14px}
.card{position:relative;padding:20px;border-radius:var(--r);background:var(--card);overflow:hidden;isolation:isolate}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:conic-gradient(from var(--ang,0deg),transparent 0 70%,var(--a),var(--b),transparent);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:ang 5s linear infinite;z-index:-1}
@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes ang{to{--ang:360deg}}
.card .num{position:absolute;right:14px;top:-6px;font-size:84px;font-weight:900;color:rgba(255,255,255,.04);line-height:1}
.tag{display:inline-block;padding:4px 12px;border-radius:99px;background:var(--grad);color:#1a1204;font-weight:800;font-size:13px}
.card h3{font-size:22px;margin:10px 0 2px;letter-spacing:-.5px}
.card p{color:var(--mut);font-size:14px}
.card .acts{display:flex;gap:10px;margin-top:16px}
.mini{flex:1;text-align:center;text-decoration:none;color:var(--tx);padding:11px;border-radius:14px;background:rgba(255,255,255,.06);font-weight:700;font-size:14px;transition:.25s}
.mini:hover{background:var(--grad);color:#1a1204}
.mini.pr{background:var(--grad);color:#1a1204}

/* MARQUEE */
.mq{overflow:hidden;margin:44px -18px 0;border-block:1px solid var(--line);padding:12px 0;mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.mq div{display:flex;gap:36px;width:max-content;animation:mq 22s linear infinite;font-weight:800;font-size:18px;color:var(--mut);white-space:nowrap}
.mq b{color:var(--a)}
@keyframes mq{to{transform:translateX(-50%)}}

footer{margin-top:40px;text-align:center;color:var(--mut);font-size:13px}

/* STICKY BAR */
.bar{position:fixed;z-index:5;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translate(-50%,120px);width:min(444px,calc(100% - 28px));display:flex;gap:10px;padding:8px;border-radius:22px;
  background:rgba(16,18,26,.75);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);transition:transform .5s cubic-bezier(.2,.9,.3,1.2)}
.bar.on{transform:translate(-50%,0)}
.bar a{flex:1;text-align:center;padding:13px;border-radius:15px;text-decoration:none;font-weight:800;color:var(--tx);background:rgba(255,255,255,.06)}
.bar a.pr{background:var(--grad);color:#1a1204}

/* REVEAL */
.rv{opacity:0;transform:translateY(28px) scale(.98);transition:opacity .8s,transform .8s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="glow g1"></div><div class="glow g2"></div>

<main>
  <header class="hero">
    <div class="logo"><span>VT</span></div>
    <h1>VIP <em>Travel</em></h1>
    <div class="handle" id="handle"></div>
    <div class="type" id="type"></div>

    <div class="road" aria-hidden="true">
      <div class="asf c1"></div><div class="asf c2"></div><div class="asf c3"></div>
      <div class="car">
        <svg viewBox="0 0 180 70" width="180">
          <defs><linearGradient id="cg" x1="0" x2="1"><stop offset="0" stop-color="#c8952a"/><stop offset="1" stop-color="#ffe08a"/></linearGradient></defs>
          <path d="M14 34c0-5 6-8 14-8h96c22 0 40 4 44 8-4 4-22 8-44 8H28c-8 0-14-3-14-8z" fill="url(#cg)"/>
          <path d="M96 30L64 4h14l44 26zM96 38L64 64h14l44-26z" fill="url(#cg)" opacity=".85"/>
          <path d="M22 30L10 12h10l18 18z" fill="url(#cg)"/>
          <g fill="#0b0d14"><circle cx="150" cy="33" r="2.5"/><circle cx="138" cy="33" r="2.5"/><circle cx="126" cy="33" r="2.5"/><circle cx="114" cy="33" r="2.5"/></g>
        </svg>
      </div>
    </div>
  </header>

  <div class="links rv" id="links"></div>

  <section class="rv">
    <div class="h2">Raqamlarda</div>
    <div class="stats" id="stats"></div>
  </section>

  <section class="rv">
    <div class="h2">Xizmatlar</div>
    <div class="svc" id="svc"></div>
  </section>

  <div class="mq"><div id="mq"></div></div>

  <section>
    <div class="h2 rv">Filiallarimiz</div>
    <div class="br" id="br"></div>
  </section>

  <footer class="rv">© <span id="yr"></span> VIP Travel Official · <span id="ft"></span></footer>
</main>

<nav class="bar" id="bar"></nav>

<script>
/* ============ SHU YERNI TO'LDIRING ============ */
const CONFIG = {
  brand: "VIP Travel Official",
  instagram: "vip_travel_official",         // @ belgisiz
  phone1: "+998 97 199 99 11",
  phone2: "",                               // TODO: ixtiyoriy 2-raqam
  telegram: "https://t.me/viptraveluz",     // Telegram kanal
  whatsapp: "",                             // TODO: https://wa.me/998XXXXXXXXX
  website: "",                              // TODO: https://...
  extra: [
    {title:"Telegram chat", sub:"t.me/viptravel_uz_chat", url:"https://t.me/viptravel_uz_chat"},
    {title:"Filiallar lokatsiyasi", sub:"t.me/viptravellocation", url:"https://t.me/viptravellocation"},
  ],
  typing: ["Shaxsiy va korporativ sayohatlar", "6 ta filial · 24/7 aloqa", "100 000+ sayohatchi tanlovi"],
  stats: [ {n:6,s:"ta filial"}, {n:100,s:"sayohatchi tanlovi",suf:"K+"}, {n:147,s:"Instagram obunachi",suf:"K"} ],
  services: [                               // TODO: xizmatlarni aniqlashtiring
    {i:"✈️",t:"Turlar",p:"Dunyo bo'ylab yo'nalishlar"},
    {i:"👤",t:"Shaxsiy sayohat",p:"Sizning xohishingizga ko'ra"},
    {i:"🏢",t:"Korporativ sayohat",p:"Jamoa va kompaniyalar uchun"},
    {i:"🕒",t:"24/7 aloqa",p:"Har doim yoningizda"},
  ],
  // Bio'da 6 ta filial deyilgan, hozircha 5 tasining manzili bor — 6-chisini qo'shing
  branches: [
    {tag:"Ц1",   name:"Ц1 filial",       addr:"Mirzo Ulug‘bek tumani, Maxatma Gandi ko‘chasi", phone:""},
    {tag:"Ц5",   name:"Ц5 filial",       addr:"Yunusobod tumani, Osiyo ko‘chasi, 85-uy",      phone:""},
    {tag:"LBZ",  name:"Labzak filial",   addr:"Shayxontohur tumani, Labzak ko‘chasi, 76-uy",  phone:""},
    {tag:"PRF",  name:"Perfectum filial",addr:"Mirobod tumani, Said Baraka ko‘chasi, 66-uy",  phone:""},
    {tag:"NUK",  name:"Nukus filial",    addr:"Nukus ko‘chasi, 86k3",                         phone:""},
  ],
};
/* ================================================ */

const $=s=>document.querySelector(s);
const tel=p=>"tel:"+p.replace(/[^\d+]/g,"");
const I={
 phone:'<svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 006.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 013 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.300.2 2.500.6 3.600.1.300 0 .700-.2 1z"/></svg>',
 tg:'<svg viewBox="0 0 24 24"><path d="M9.5 15.3l-.4 4.100c.6 0 .8-.2 1.100-.5l2.600-2.500 5.400 3.900c1 .5 1.700.3 2-.9L22 5.300c.3-1.400-.5-2-1.500-1.600L2.400 10.700c-1.400.5-1.400 1.300-.2 1.700l4.600 1.400 10.700-6.700c.5-.3 1-.1.6.2z"/></svg>',
 ig:'<svg viewBox="0 0 24 24"><path d="M7 2h10a5 5 0 015 5v10a5 5 0 01-5 5H7a5 5 0 01-5-5V7a5 5 0 015-5zm0 2a3 3 0 00-3 3v10a3 3 0 003 3h10a3 3 0 003-3V7a3 3 0 00-3-3H7zm5 3.500A4.500 4.500 0 1112 16.500 4.500 4.500 0 0112 7.500zm0 2A2.500 2.500 0 1012 14.500 2.500 2.500 0 0012 9.500zM17.500 6a1 1 0 110 2 1 1 0 010-2z"/></svg>',
 wa:'<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 00-8.600 15.100L2 22l5-1.300A10 10 0 1012 2zm5.200 14.200c-.2.600-1.300 1.200-1.800 1.200-.5.100-1 .2-3.300-.7-2.800-1.200-4.600-4-4.700-4.200-.1-.2-1.100-1.500-1.100-2.800 0-1.300.7-2 1-2.300.2-.3.500-.3.700-.3h.5c.2 0 .4 0 .6.500l.8 2c.1.200.1.300 0 .500l-.3.400-.3.400c-.1.200-.3.300-.1.600.2.300.8 1.300 1.700 2.100 1.200 1 2.100 1.300 2.400 1.500.3.100.5.100.6-.1l.9-1.100c.2-.3.4-.2.600-.1l1.900.9c.3.100.5.200.5.300.1.200.1.800-.1 1.300z"/></svg>',
 web:'<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm6.900 9h-3a15 15 0 00-1.200-5.600A8 8 0 0118.900 11zM12 4c.8 1 1.700 3.100 2 7h-4c.3-3.900 1.200-6 2-7zM4 12h3.100c.1 2.100.5 4 1.200 5.600A8 8 0 014 12zm3.100-1H4a8 8 0 014.300-5.600C7.600 7 7.200 8.900 7.100 11zM12 20c-.8-1-1.700-3.100-2-7h4c-.3 3.900-1.200 6-2 7zm3.700-2.400c.7-1.600 1.100-3.500 1.200-5.600H20a8 8 0 01-4.300 5.600z"/></svg>',
 link:'<svg viewBox="0 0 24 24"><path d="M3.900 12a3.100 3.100 0 013.100-3.100h4V7H7a5 5 0 000 10h4v-1.900H7A3.100 3.100 0 013.900 12zM8 13h8v-2H8v2zm9-6h-4v1.900h4a3.100 3.100 0 010 6.200h-4V17h4a5 5 0 000-10z"/></svg>'
};

document.title=CONFIG.brand+" — @"+CONFIG.instagram;
$("#handle").textContent="@"+CONFIG.instagram;
$("#yr").textContent=new Date().getFullYear();
$("#ft").textContent="@"+CONFIG.instagram;

/* links */
const L=[];
L.push(`<a class="btn main" href="${tel(CONFIG.phone1)}"><span class="ico">${I.phone}</span><span>Hoziroq qo'ng'iroq<small>${CONFIG.phone1}</small></span><span class="arr">→</span></a>`);
const duo=[];
if(CONFIG.telegram)duo.push(`<a class="btn" href="${CONFIG.telegram}" target="_blank" rel="noopener"><span class="ico">${I.tg}</span><span>Telegram kanal<small>Yangiliklar</small></span></a>`);
if(CONFIG.whatsapp)duo.push(`<a class="btn" href="${CONFIG.whatsapp}" target="_blank" rel="noopener"><span class="ico">${I.wa}</span><span>WhatsApp<small>Yozing</small></span></a>`);
if(duo.length)L.push(`<div class="row2">${duo.join("")}</div>`);
L.push(`<a class="btn" href="https://instagram.com/${CONFIG.instagram}" target="_blank" rel="noopener"><span class="ico">${I.ig}</span><span>Instagram<small>@${CONFIG.instagram}</small></span><span class="arr">→</span></a>`);
if(CONFIG.phone2)L.push(`<a class="btn" href="${tel(CONFIG.phone2)}"><span class="ico">${I.phone}</span><span>Qo'shimcha raqam<small>${CONFIG.phone2}</small></span><span class="arr">→</span></a>`);
if(CONFIG.website)L.push(`<a class="btn" href="${CONFIG.website}" target="_blank" rel="noopener"><span class="ico">${I.web}</span><span>Vebsayt<small>${CONFIG.website.replace(/^https?:\/\//,"")}</small></span><span class="arr">→</span></a>`);
CONFIG.extra.forEach(e=>L.push(`<a class="btn" href="${e.url}" target="_blank" rel="noopener"><span class="ico">${I.link}</span><span>${e.title}<small>${e.sub||""}</small></span><span class="arr">→</span></a>`));
$("#links").innerHTML=L.join("");

/* stats */
$("#stats").innerHTML=CONFIG.stats.map(s=>`<div class="stat"><b data-n="${s.n}" data-suf="${s.suf||""}">0</b><span>${s.s}</span></div>`).join("");
/* services */
$("#svc").innerHTML=CONFIG.services.map(s=>`<div class="s"><i>${s.i}</i><b>${s.t}</b><p>${s.p}</p></div>`).join("");
/* marquee */
const mq=(CONFIG.branches.map(b=>b.name.toUpperCase()).join(" <b>✦</b> ")+" <b>✦</b> ");
$("#mq").innerHTML=`<span>${mq}</span><span>${mq}</span>`;
/* branches */
$("#br").innerHTML=CONFIG.branches.map((b,i)=>{
  const q=encodeURIComponent(b.addr+", Toshkent");
  return `<article class="card rv"><span class="num">0${i+1}</span><span class="tag">${b.tag}</span><h3>${b.name}</h3><p>📍 ${b.addr}</p>
  <div class="acts"><a class="mini pr" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${q}">Xaritada ko'rish</a>
  ${b.phone?`<a class="mini" href="${tel(b.phone)}">Qo'ng'iroq</a>`:`<a class="mini" href="${tel(CONFIG.phone1)}">Qo'ng'iroq</a>`}</div></article>`;
}).join("");
/* sticky bar */
$("#bar").innerHTML=`<a class="pr" href="${tel(CONFIG.phone1)}">📞 Qo'ng'iroq</a><a href="#br">📍 Filiallar</a>`+(CONFIG.telegram?`<a href="${CONFIG.telegram}" target="_blank" rel="noopener">✈️ Telegram</a>`:"");
addEventListener("scroll",()=>$("#bar").classList.toggle("on",scrollY>260),{passive:true});

/* typing */
(function(){const el=$("#type");let w=0,c=0,d=false;
 (function tick(){const t=CONFIG.typing[w];c+=d?-1:1;el.textContent=t.slice(0,c);
  let ms=d?28:60;if(!d&&c===t.length){d=true;ms=1600}else if(d&&c===0){d=false;w=(w+1)%CONFIG.typing.length;ms=350}
  setTimeout(tick,ms)})()})();

/* reveal + count up */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;e.target.classList.add("in");
  e.target.querySelectorAll("[data-n]").forEach(b=>{const n=+b.dataset.n,suf=b.dataset.suf;let t0;
    (function f(t){t0=t0||t;const p=Math.min((t-t0)/1200,1);b.textContent=Math.round(n*(1-Math.pow(1-p,3)))+suf;if(p<1)requestAnimationFrame(f)})(performance.now())});
  io.unobserve(e.target)}),{threshold:.15});
document.querySelectorAll(".rv").forEach((el,i)=>{el.style.transitionDelay=(i%4)*70+"ms";io.observe(el)});

/* 3D tilt on cards (desktop) */
document.querySelectorAll(".s,.card").forEach(el=>{
  el.addEventListener("pointermove",e=>{if(e.pointerType!=="mouse")return;const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
    el.style.transform=`perspective(700px) rotateY(${x*10}deg) rotateX(${-y*10}deg) translateY(-3px)`});
  el.addEventListener("pointerleave",()=>el.style.transform="")});

/* background: speed lines + particles */
(function(){const cv=$("#fx"),x=cv.getContext("2d");let W,H,P=[];
 const rs=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight;P=Array.from({length:Math.min(70,W/14|0)},()=>mk(true))};
 function mk(r){return{x:Math.random()*W,y:r?Math.random()*H:-20,l:30+Math.random()*90,v:2+Math.random()*5,a:.05+Math.random()*.25,h:Math.random()<.2?190:24}}
 let mx=0,my=0;addEventListener("pointermove",e=>{mx=(e.clientX/W-.5)*30;my=(e.clientY/H-.5)*30},{passive:true});
 (function loop(){x.clearRect(0,0,W,H);
  P.forEach(p=>{p.y+=p.v;if(p.y-p.l>H)Object.assign(p,mk(false));
   const g=x.createLinearGradient(0,p.y-p.l,0,p.y);g.addColorStop(0,"hsla("+p.h+",100%,60%,0)");g.addColorStop(1,"hsla("+p.h+",100%,60%,"+p.a+")");
   x.strokeStyle=g;x.lineWidth=1.5;x.beginPath();x.moveTo(p.x+mx*p.v/5,p.y-p.l);x.lineTo(p.x+mx*p.v/5,p.y);x.stroke()});
  requestAnimationFrame(loop)})();
 addEventListener("resize",rs);rs()})();
</script>
</body>
</html>
