<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VIP Travel Official — Turlar | Toshkent</title>
<meta name="description" content="VIP Travel Official — shaxsiy va korporativ sayohatlar. Filiallar, manzillar va aloqa. Toshkent, O'zbekiston.">
<meta name="theme-color" content="#050716">
<style>
:root{
  --bg1:#040617; --bg2:#0a1030; --bg3:#1b1443; --bg4:#3d2347;
  --gold1:#c8952a; --gold2:#ffe08a; --gold3:#fff3c4;
  --grad:linear-gradient(120deg,var(--gold1),var(--gold2) 55%,#f3c65a);
  --tx:#f5f6fb; --mut:#a3a9c6; --line:rgba(255,255,255,.1);
  --glass:rgba(18,22,52,.55);
  --r:24px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden;min-height:100vh;
  background:var(--bg2)}
.bg{position:fixed;inset:0;z-index:0;background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 42%,var(--bg3) 78%,var(--bg4) 100%)}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.horizon{position:fixed;left:-20%;right:-20%;bottom:-38vh;height:70vh;z-index:0;pointer-events:none;border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,190,90,.34),rgba(255,120,80,.1) 55%,transparent);animation:breathe 7s ease-in-out infinite}
@keyframes breathe{50%{opacity:.65;transform:scale(1.05)}}
main{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:22px 18px 130px}
svg.i{width:24px;height:24px;fill:rgba(255,200,80,.13);stroke:url(#gold);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* HERO */
.logo{width:92px;height:92px;margin:6px auto 4px;position:relative;border-radius:50%;filter:drop-shadow(0 8px 24px rgba(255,190,70,.35));animation:bob 4s ease-in-out infinite}
.logo svg,.logo img{width:100%;height:100%;display:block;border-radius:50%;object-fit:cover}
.logo::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:1px solid rgba(255,224,138,.45);animation:pulse 2.6s ease-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes pulse{from{transform:scale(.92);opacity:1}to{transform:scale(1.3);opacity:0}}
.hero{text-align:center}
.globe-wrap{position:relative;width:min(230px,62vw);aspect-ratio:1;margin:0 auto -6px}
.globe-wrap canvas{width:100%;height:100%;display:block}
.globe-wrap::before{content:"";position:absolute;inset:8%;border-radius:50%;background:radial-gradient(closest-side,rgba(110,140,255,.32),transparent 70%);filter:blur(14px);animation:breathe 5s ease-in-out infinite}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px 5px 8px;border-radius:99px;font-size:10px;letter-spacing:.28em;text-transform:uppercase;font-weight:700;color:var(--gold2);
  background:rgba(255,224,138,.08);border:1px solid rgba(255,224,138,.28)}
.badge svg{width:16px;height:16px;stroke-width:2}
h1{font-size:clamp(40px,12vw,54px);font-weight:900;letter-spacing:-1.5px;line-height:1.05}
h1 span{color:var(--tx)}
.meta{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% 100%;animation:sheen 5s linear infinite}
@keyframes sheen{to{background-position:-200% 0}}
.handle{color:var(--mut);font-size:15px}
.type{margin-top:14px;font-size:18px;min-height:28px;color:#e6e9f7;font-weight:600}
.type::after{content:"";display:inline-block;width:2px;height:1em;background:var(--gold2);margin-left:3px;vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* BUTTONS */
.links{display:grid;gap:12px;margin-top:26px}
.btn{position:relative;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:20px;text-decoration:none;color:var(--tx);font-weight:700;overflow:hidden;
  background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:transform .3s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .3s}
.btn:hover,.btn:active{transform:translateY(-3px);border-color:rgba(255,224,138,.6);box-shadow:0 16px 36px -14px rgba(255,190,70,.55)}
.chip{width:46px;height:46px;flex:none;border-radius:16px;display:grid;place-items:center;position:relative;
  background:linear-gradient(145deg,rgba(255,224,138,.16),rgba(255,224,138,.03));border:1px solid rgba(255,224,138,.22);transition:transform .4s}
.btn:hover .chip{transform:rotate(-8deg) scale(1.08)}
.btn small{display:block;color:var(--mut);font-weight:500;font-size:13px}
.btn .go{margin-left:auto;opacity:.6;transition:transform .3s,opacity .3s}
.btn .go svg{width:20px;height:20px}
.btn:hover .go{opacity:1;transform:translate(3px,-3px)}
.btn.main{background:var(--grad);color:#1a1204;border:0;padding:18px 16px;font-size:18px;box-shadow:0 18px 44px -14px rgba(255,190,70,.75);animation:pop 2.4s ease-in-out infinite}
.btn.main::after{content:"";position:absolute;top:0;left:-60%;width:35%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 3.6s ease-in-out infinite}
@keyframes shine{0%,55%{left:-60%}100%{left:130%}}
@keyframes pop{50%{transform:scale(1.02)}}
.btn.main .chip{background:rgba(0,0,0,.12);border-color:rgba(0,0,0,.12)}
.btn.main small{color:rgba(26,18,4,.7)}
.btn.main svg.i{stroke:#1a1204;fill:rgba(26,18,4,.12);animation:ring 2.4s ease-in-out infinite}
@keyframes ring{0%,60%,100%{transform:rotate(0)}66%{transform:rotate(-14deg)}72%{transform:rotate(12deg)}78%{transform:rotate(-10deg)}84%{transform:rotate(8deg)}}
.btn.main .go{opacity:1}

/* SECTION TITLES */
section{margin-top:52px}
.h2{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.h2 svg{width:20px;height:20px}
.h2 b{font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--mut);font-weight:700}
.h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(255,224,138,.35),transparent)}

/* SERVICES */
.svc{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.s{position:relative;padding:18px 16px;border-radius:var(--r);background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);overflow:hidden;transition:border-color .3s,transform .3s}
.s::before{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,200,80,.25),transparent);transition:transform .5s}
.s:hover{border-color:rgba(255,224,138,.5)}
.s:hover::before{transform:scale(1.8)}
.s .chip{margin-bottom:12px}
.s b{display:block;font-size:15px}
.s p{font-size:13px;color:var(--mut);margin-top:2px;line-height:1.35}

/* DESTINATIONS MARQUEE */
.mq{overflow:hidden;margin:50px -18px 0;padding:14px 0;mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.mq div{display:flex;gap:26px;width:max-content;animation:mq 30s linear infinite;align-items:center;white-space:nowrap;font-weight:800;font-size:20px;letter-spacing:.02em;color:rgba(245,246,251,.5)}
.mq i{color:var(--gold2);font-style:normal;font-size:14px}
@keyframes mq{to{transform:translateX(-50%)}}

/* BOARDING PASS */
.br{display:grid;gap:18px}
.tk{--py:96px;position:relative;border-radius:22px;background:linear-gradient(160deg,rgba(30,36,84,.8),rgba(16,20,48,.85));border:1px solid rgba(255,224,138,.16);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  -webkit-mask:radial-gradient(circle at 0 var(--py),transparent 11px,#000 12px) left/51% 100% no-repeat,radial-gradient(circle at 100% var(--py),transparent 11px,#000 12px) right/51% 100% no-repeat;
  mask:radial-gradient(circle at 0 var(--py),transparent 11px,#000 12px) left/51% 100% no-repeat,radial-gradient(circle at 100% var(--py),transparent 11px,#000 12px) right/51% 100% no-repeat;
  transition:transform .3s}
.tk::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--grad);border-radius:22px 22px 0 0}
.tk-top{height:var(--py);padding:20px 22px 0;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px}
.tk small{display:block;font-size:10px;letter-spacing:.24em;color:var(--mut);font-weight:700}
.tk-top b{font-size:26px;font-weight:900;letter-spacing:-.5px;line-height:1.1;display:block}
.tk-top .to{text-align:right}
.tk-top .to b{font-size:16px;letter-spacing:0;font-weight:800}
.flight{position:relative;height:24px;display:flex;align-items:center}
.flight::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px dashed rgba(255,224,138,.35)}
.flight svg{position:absolute;left:0;top:0;width:24px;height:24px;fill:var(--gold2);stroke:none;filter:drop-shadow(0 0 6px rgba(255,224,138,.8));animation:fly 3s ease-in-out infinite}
@keyframes fly{0%{left:0;opacity:0}15%{opacity:1}85%{opacity:1}100%{left:calc(100% - 24px);opacity:0}}
.tk::after{content:"";position:absolute;left:24px;right:24px;top:var(--py);border-top:2px dashed rgba(255,255,255,.14)}
.tk-bot{padding:20px 22px 20px}
.tk-bot .addr{display:flex;gap:10px;align-items:flex-start;color:#dfe3f6;font-size:15px;line-height:1.4}
.tk-bot .addr svg{width:22px;height:22px;margin-top:1px}
.acts{display:flex;gap:10px;margin-top:16px}
.mini{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--tx);padding:12px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-weight:700;font-size:14px;transition:.25s}
.mini svg{width:18px;height:18px}
.mini:hover{border-color:rgba(255,224,138,.6)}
.mini.pr{background:var(--grad);color:#1a1204;border:0}
.mini.pr svg{stroke:#1a1204;fill:rgba(26,18,4,.1)}
.bar-code{height:26px;margin-top:16px;opacity:.35;background:repeating-linear-gradient(90deg,#fff 0 2px,transparent 2px 4px,#fff 4px 5px,transparent 5px 9px,#fff 9px 12px,transparent 12px 14px)}

footer{margin-top:52px;text-align:center;color:var(--mut);font-size:13px}
footer b{display:block;font-size:15px;color:var(--tx);margin-bottom:4px}

/* STICKY BAR */
.bar{position:fixed;z-index:5;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translate(-50%,130px);width:min(444px,calc(100% - 28px));display:flex;gap:8px;padding:8px;border-radius:24px;
  background:rgba(14,18,44,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,224,138,.2);transition:transform .55s cubic-bezier(.2,.9,.3,1.2)}
.bar.on{transform:translate(-50%,0)}
.bar a{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 6px;border-radius:17px;text-decoration:none;font-weight:800;font-size:14px;color:var(--tx);background:rgba(255,255,255,.06)}
.bar a svg{width:19px;height:19px}
.bar a.pr{background:var(--grad);color:#1a1204}
.bar a.pr svg{stroke:#1a1204;fill:rgba(26,18,4,.1)}

/* REVEAL */
.rv{opacity:0;transform:translateY(30px);transition:opacity .8s,transform .8s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="2" y1="2" x2="22" y2="22"><stop offset="0" stop-color="#ffe9a8"/><stop offset="1" stop-color="#e0a32e"/></linearGradient>
</defs></svg>
<div class="bg"></div>
<canvas id="sky"></canvas>
<div class="horizon"></div>

<main>
  <header class="hero">
    <div class="logo" id="logo"><svg viewBox="0 0 120 120" role="img" aria-label="VIP Travel logo">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe9a8"/><stop offset="1" stop-color="#d49a2a"/></linearGradient>
      <radialGradient id="lb" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#1b2a63"/><stop offset="1" stop-color="#070b22"/></radialGradient></defs>
      <circle cx="60" cy="60" r="57" fill="url(#lb)" stroke="url(#lg)" stroke-width="3"/>
      <g fill="none" stroke="#e8edff" stroke-width="1.6" opacity=".9"><circle cx="60" cy="47" r="25"/><ellipse cx="60" cy="47" rx="11" ry="25"/><path d="M35 47h50M39 36h42M39 58h42"/></g>
      <g class="orbit"><ellipse cx="60" cy="47" rx="42" ry="13" fill="none" stroke="url(#lg)" stroke-width="2" transform="rotate(-18 60 47)"/></g>
      <path d="M92 38l-9 1.500-3 3 5-.5-4 5 3 1 4-5 .5 5 3-3z" fill="url(#lg)" transform="rotate(-20 86 42)"/>
      <text x="60" y="99" text-anchor="middle" font-family="system-ui,Arial" font-weight="800" font-size="12" letter-spacing="1" fill="#f5f6fb">VIP TRAVEL</text>
    </svg></div>
    <div class="globe-wrap"><canvas id="globe"></canvas></div>
    <h1><span>VIP</span> <em>Travel</em></h1>
    <div class="meta"><div class="badge" id="badge"></div><div class="handle" id="handle"></div></div>
    <div class="type" id="type"></div>
  </header>

  <div class="links rv" id="links"></div>

  <section class="rv">
    <div class="h2" id="h-svc"><b>Xizmatlar</b></div>
    <div class="svc" id="svc"></div>
  </section>

  <div class="mq" aria-hidden="true"><div id="mq"></div></div>

  <section id="filial">
    <div class="h2 rv" id="h-br"><b>Filiallarimiz</b></div>
    <div class="br" id="br"></div>
  </section>

  <footer class="rv"><b>VIP Travel Official</b>© <span id="yr"></span> · Toshkent, O‘zbekiston</footer>
</main>

<nav class="bar" id="bar"></nav>

<script>
/* ============ SHU YERNI TO'LDIRING ============ */
const CONFIG = {
  brand: "VIP Travel Official",
  logo: "",                                 // logo.png faylini shu papkaga qo'ying va "logo.png" deb yozing
  instagram: "vip_travel_official",         // @ belgisiz
  phone1: "+998 97 199 99 11",
  phone2: "",                               // TODO: ixtiyoriy 2-raqam
  telegram: "https://t.me/viptraveluz",     // Telegram kanal
  whatsapp: "",                             // TODO: https://wa.me/998XXXXXXXXX
  website: "",                              // TODO: https://...
  extra: [
    {icon:"chat", title:"Telegram chat",        sub:"t.me/viptravel_uz_chat", url:"https://t.me/viptravel_uz_chat"},
    {icon:"pin",  title:"Filiallar lokatsiyasi", sub:"t.me/viptravellocation", url:"https://t.me/viptravellocation"},
  ],
  typing: ["Orzuingizdagi sayohat — bizdan", "Shaxsiy va korporativ sayohatlar", "24/7 aloqadamiz"],
  services: [                               // TODO: xizmatlarni aniqlashtiring
    {i:"globe",  t:"Turlar",             p:"Dunyo bo'ylab yo'nalishlar"},
    {i:"user",   t:"Shaxsiy sayohat",    p:"Sizning xohishingizga ko'ra"},
    {i:"brief",  t:"Korporativ sayohat", p:"Jamoa va kompaniyalar uchun"},
    {i:"headset",t:"24/7 aloqa",         p:"Har doim yoningizda"},
  ],
  destinations: ["Dubay","Istanbul","Antaliya","Maldiv","Tailand","Misr","Parij","Bali","Kipr"], // TODO: o'zingizniki bilan almashtiring
  // Bio'da 6 ta filial deyilgan, hozircha 5 tasining manzili bor — 6-chisini qo'shing
  branches: [
    {tag:"Ц1",  district:"Mirzo Ulug‘bek", street:"Maxatma Gandi ko‘chasi",  phone:""},
    {tag:"Ц5",  district:"Yunusobod",      street:"Osiyo ko‘chasi, 85-uy",   phone:""},
    {tag:"LBZ", district:"Shayxontohur",   street:"Labzak ko‘chasi, 76-uy",  phone:"", name:"Labzak"},
    {tag:"PRF", district:"Mirobod",        street:"Said Baraka ko‘chasi, 66-uy", phone:"", name:"Perfectum"},
    {tag:"NUK", district:"Toshkent",       street:"Nukus ko‘chasi, 86k3",    phone:"", name:"Nukus"},
  ],
};
/* ================================================ */

const $=s=>document.querySelector(s);
const tel=p=>"tel:"+p.replace(/[^\d+]/g,"");
const ICON={
 phone:'<path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.500 19.500 0 01-6-6A19.800 19.800 0 012.100 4.200 2 2 0 014.100 2h3a2 2 0 012 1.700c.1 1 .4 1.900.7 2.800a2 2 0 01-.5 2.100L8.100 9.900a16 16 0 006 6l1.300-1.300a2 2 0 012.100-.4c.9.300 1.900.6 2.800.7A2 2 0 0122 16.900z"/>',
 send:'<path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/>',
 insta:'<rect x="2.500" y="2.500" width="19" height="19" rx="5.500"/><circle cx="12" cy="12" r="4.200"/><circle cx="17.600" cy="6.400" r=".6"/>',
 chat:'<path d="M21 11.500a8.400 8.400 0 01-.9 3.800 8.500 8.500 0 01-7.600 4.700 8.400 8.400 0 01-3.800-.9L3 21l1.900-5.700A8.400 8.400 0 014 11.500 8.500 8.500 0 018.700 3.900 8.400 8.400 0 0112.500 3h.5a8.500 8.500 0 018 8v.5z"/>',
 pin:'<path d="M20 10c0 6.500-8 12-8 12s-8-5.500-8-12a8 8 0 0116 0z"/><circle cx="12" cy="10" r="3"/>',
 globe:'<circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.300 15.300 0 014 10 15.300 15.300 0 01-4 10 15.300 15.300 0 01-4-10 15.300 15.300 0 014-10z"/>',
 user:'<path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>',
 brief:'<rect x="2" y="7" width="20" height="14" rx="3"/><path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/><path d="M2 13h20"/>',
 headset:'<path d="M3 18v-6a9 9 0 0118 0v6"/><path d="M21 19a2 2 0 01-2 2h-1a2 2 0 01-2-2v-3a2 2 0 012-2h3zM3 19a2 2 0 002 2h1a2 2 0 002-2v-3a2 2 0 00-2-2H3z"/>',
 out:'<path d="M7 17L17 7"/><path d="M8 7h9v9"/>',
 plane:'<path d="M17.800 19.200L16 11l3.500-3.500C21 6 21.500 4 21 3c-1-.5-3 0-4.500 1.500L13 8 4.800 6.200c-.5-.1-.9.100-1.100.5l-.3.500c-.2.500-.1 1 .3 1.300L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.500 5.300c.3.400.8.500 1.300.3l.5-.2c.4-.3.600-.7.500-1.200z"/>',
 check:'<path d="M20 6L9 17l-5-5"/>',
 mapc:'<path d="M9 3L3 6v15l6-3 6 3 6-3V3l-6 3-6-3z"/><path d="M9 3v15M15 6v15"/>'
};
const ic=(n,c="")=>`<svg class="i ${c}" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;
const chip=n=>`<span class="chip">${ic(n)}</span>`;
const go=`<span class="go">${ic("out")}</span>`;

if(CONFIG.logo)$("#logo").innerHTML=`<img src="${CONFIG.logo}" alt="${CONFIG.brand}">`;
document.title=CONFIG.brand+" — Turlar | Toshkent";
$("#badge").innerHTML=ic("check")+"Official";
$("#handle").textContent="@"+CONFIG.instagram;
$("#yr").textContent=new Date().getFullYear();
$("#h-svc").insertAdjacentHTML("afterbegin",ic("plane"));
$("#h-br").insertAdjacentHTML("afterbegin",ic("mapc"));

/* links */
const L=[];
L.push(`<a class="btn main" href="${tel(CONFIG.phone1)}">${chip("phone")}<span>Hoziroq qo'ng'iroq<small>${CONFIG.phone1}</small></span>${go}</a>`);
if(CONFIG.telegram)L.push(`<a class="btn" href="${CONFIG.telegram}" target="_blank" rel="noopener">${chip("send")}<span>Telegram kanal<small>Yangiliklar va chegirmalar</small></span>${go}</a>`);
L.push(`<a class="btn" href="https://instagram.com/${CONFIG.instagram}" target="_blank" rel="noopener">${chip("insta")}<span>Instagram<small>@${CONFIG.instagram}</small></span>${go}</a>`);
if(CONFIG.whatsapp)L.push(`<a class="btn" href="${CONFIG.whatsapp}" target="_blank" rel="noopener">${chip("chat")}<span>WhatsApp<small>Yozing</small></span>${go}</a>`);
if(CONFIG.phone2)L.push(`<a class="btn" href="${tel(CONFIG.phone2)}">${chip("phone")}<span>Qo'shimcha raqam<small>${CONFIG.phone2}</small></span>${go}</a>`);
if(CONFIG.website)L.push(`<a class="btn" href="${CONFIG.website}" target="_blank" rel="noopener">${chip("globe")}<span>Vebsayt<small>${CONFIG.website.replace(/^https?:\/\//,"")}</small></span>${go}</a>`);
CONFIG.extra.forEach(e=>L.push(`<a class="btn" href="${e.url}" target="_blank" rel="noopener">${chip(e.icon||"globe")}<span>${e.title}<small>${e.sub||""}</small></span>${go}</a>`));
$("#links").innerHTML=L.join("");

/* services */
$("#svc").innerHTML=CONFIG.services.map(s=>`<div class="s">${chip(s.i)}<b>${s.t}</b><p>${s.p}</p></div>`).join("");
/* marquee */
const m=CONFIG.destinations.map(d=>d.toUpperCase()).join(" <i>✈</i> ")+" <i>✈</i> ";
$("#mq").innerHTML=`<span>${m}</span><span>${m}</span>`;
/* boarding passes */
$("#br").innerHTML=CONFIG.branches.map((b,i)=>{
  const addr=b.street;
  const q=encodeURIComponent(b.street+", "+(b.district!=="Toshkent"?b.district+" tumani, ":"")+"Toshkent");
  const call=b.phone||CONFIG.phone1;
  return `<article class="tk rv">
    <div class="tk-top">
      <div><small>FILIAL</small><b>${b.tag}</b></div>
      <div class="flight">${ic("plane")}</div>
      <div class="to"><small>${b.district==="Toshkent"?"SHAHAR":"TUMAN"}</small><b>${b.district}</b></div>
    </div>
    <div class="tk-bot">
      <div class="addr">${ic("pin")}<span>${addr}</span></div>
      <div class="acts">
        <a class="mini pr" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${q}">${ic("mapc")}Xarita</a>
        <a class="mini" href="${tel(call)}">${ic("phone")}Qo'ng'iroq</a>
      </div>
      <div class="bar-code"></div>
    </div>
  </article>`;
}).join("");
/* sticky bar */
$("#bar").innerHTML=`<a class="pr" href="${tel(CONFIG.phone1)}">${ic("phone")}Qo'ng'iroq</a><a href="#filial">${ic("pin")}Filiallar</a>`+(CONFIG.telegram?`<a href="${CONFIG.telegram}" target="_blank" rel="noopener">${ic("send")}Telegram</a>`:"");
addEventListener("scroll",()=>$("#bar").classList.toggle("on",scrollY>300),{passive:true});

/* typing */
(function(){const el=$("#type");let w=0,c=0,d=false;
 (function tick(){const t=CONFIG.typing[w];c+=d?-1:1;el.textContent=t.slice(0,c);
  let ms=d?26:58;if(!d&&c===t.length){d=true;ms=1700}else if(d&&c===0){d=false;w=(w+1)%CONFIG.typing.length;ms=350}
  setTimeout(tick,ms)})()})();

/* reveal */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});
document.querySelectorAll(".rv").forEach((el,i)=>{el.style.transitionDelay=(i%3)*80+"ms";io.observe(el)});

/* ============ SKY: stars, clouds, planes, shooting stars ============ */
(function(){
 const cv=$("#sky"),x=cv.getContext("2d");let W,H,D,stars=[],clouds=[],planes=[],shots=[],t=0,sy=0;
 const R=(a,b)=>a+Math.random()*(b-a);
 function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;x.setTransform(D,0,0,D,0,0);
  stars=Array.from({length:Math.round(W*H/5500)},()=>({x:R(0,W),y:R(0,H*1.1),r:R(.3,1.5),p:R(0,6.28),s:R(.6,2.2),k:R(.1,.5)}));
  clouds=Array.from({length:9},(_,i)=>({x:R(-200,W),y:R(H*.08,H*1.05),s:R(.7,1.7),v:R(.08,.3),a:R(.05,.13),k:R(.15,.6),tint:i%3===0?"255,196,120":"160,178,255"}))}
 function cloud(c){const w=190*c.s;
  [[0,0,.55],[.42,.12,.42],[-.42,.14,.4],[.15,-.15,.4],[-.15,-.1,.38]].forEach(([dx,dy,r])=>{
   const px=c.x+dx*w,py=c.y+dy*w*.6-sy*c.k,rr=r*w;const g=x.createRadialGradient(px,py,0,px,py,rr);
   g.addColorStop(0,`rgba(${c.tint},${c.a})`);g.addColorStop(1,`rgba(${c.tint},0)`);x.fillStyle=g;x.beginPath();x.arc(px,py,rr,0,6.283);x.fill()})}
 function plane(p){ // small airliner silhouette + contrail
  const py=p.y-sy*.2;
  const g=x.createLinearGradient(p.x-p.tr*p.d,0,p.x,0);g.addColorStop(0,"rgba(255,255,255,0)");g.addColorStop(1,`rgba(255,255,255,${p.o*.22})`);
  x.strokeStyle=g;x.lineWidth=1.2*p.z;x.beginPath();x.moveTo(p.x-p.tr*p.d,py);x.lineTo(p.x,py);x.stroke();
  x.save();x.translate(p.x,py);x.scale(p.d*p.z,p.z);x.fillStyle=`rgba(255,240,205,${p.o})`;
  x.beginPath();x.moveTo(12,0);x.quadraticCurveTo(6,-2.2,-8,-2);x.lineTo(-11,-6);x.lineTo(-13,-6);x.lineTo(-11,-1.5);x.lineTo(-11,1.5);x.lineTo(-13,6);x.lineTo(-11,6);x.lineTo(-8,2);x.quadraticCurveTo(6,2.2,12,0);x.fill();
  x.beginPath();x.moveTo(3,-1.5);x.lineTo(-4,-13);x.lineTo(-7,-13);x.lineTo(-3,-1.5);x.fill();x.beginPath();x.moveTo(3,1.5);x.lineTo(-4,13);x.lineTo(-7,13);x.lineTo(-3,1.5);x.fill();
  x.fillStyle=`rgba(255,80,80,${p.o*(Math.sin(t*6+p.x)>0?1:.1)})`;x.beginPath();x.arc(-4,-12.500,1.100,0,6.283);x.fill();
  x.restore()}
 function spawn(){const d=Math.random()<.5?1:-1;planes.push({d,x:d>0?-160:W+160,y:R(H*.06,H*.75),v:R(.5,1.1)*(W<600?1:1.6)*d,z:R(.6,1.1),o:R(.3,.5),tr:R(90,170)})}
 function loop(){t+=.016;sy=scrollY;x.clearRect(0,0,W,H);
  clouds.forEach(c=>{c.x+=c.v;if(c.x-200*c.s>W)c.x=-260*c.s;cloud(c)});
  stars.forEach(s=>{const a=.35+.65*Math.abs(Math.sin(t*s.s+s.p));x.fillStyle=`rgba(255,244,220,${a*.85})`;x.beginPath();x.arc(s.x,(s.y-sy*s.k+H*3)%(H*1.1),s.r,0,6.283);x.fill()});
  if(Math.random()<.004&&shots.length<2)shots.push({x:R(W*.2,W),y:R(0,H*.4),l:0,v:R(9,14)});
  shots=shots.filter(s=>{s.x-=s.v;s.y+=s.v*.45;s.l+=1;const g=x.createLinearGradient(s.x,s.y,s.x+90,s.y-40);g.addColorStop(0,"rgba(255,255,255,.9)");g.addColorStop(1,"rgba(255,255,255,0)");
   x.strokeStyle=g;x.lineWidth=1.6;x.beginPath();x.moveTo(s.x,s.y);x.lineTo(s.x+90,s.y-40);x.stroke();return s.l<50});
  if(planes.length<2&&Math.random()<.004)spawn();
  planes=planes.filter(p=>{p.x+=p.v;plane(p);return p.x>-260&&p.x<W+260});
  requestAnimationFrame(loop)}
 addEventListener("resize",size);size();spawn();planes[0].x=R(W*.1,W*.6);loop()})();

/* ============ GLOBE with flight routes from Tashkent ============ */
(function(){
 const cv=$("#globe"),g=cv.getContext("2d"),S=320,D=Math.min(devicePixelRatio||1,2);cv.width=cv.height=S*D;g.scale(D,D);
 const cx=S/2,cy=S/2,R=118,TILT=.42,rad=Math.PI/180;
 const v=(la,lo)=>[Math.cos(la*rad)*Math.sin(lo*rad),Math.sin(la*rad),Math.cos(la*rad)*Math.cos(lo*rad)];
 let rot=-1.2;
 const P=(a,k=1)=>{const c=Math.cos(rot),s=Math.sin(rot);let x=a[0]*c+a[2]*s,z=-a[0]*s+a[2]*c,y=a[1];
  const y2=y*Math.cos(TILT)-z*Math.sin(TILT),z2=y*Math.sin(TILT)+z*Math.cos(TILT);return{x:cx+x*R*k,y:cy-y2*R*k,z:z2}};
 const dots=[];const N=520,ga=Math.PI*(3-Math.sqrt(5));for(let i=0;i<N;i++){const y=1-2*(i+.5)/N,r=Math.sqrt(1-y*y),th=ga*i;dots.push([Math.cos(th)*r,y,Math.sin(th)*r])}
 const TAS=v(41.3,69.2);
 const cities=[["Dubay",25.2,55.3],["Istanbul",41,29],["Parij",48.9,2.3],["Bangkok",13.7,100.5],["Maldiv",4.2,73.5],["Antaliya",36.9,30.7]].map(c=>({n:c[0],a:v(c[1],c[2])}));
 const arc=(a,b,t)=>{const dot=Math.min(1,Math.max(-1,a[0]*b[0]+a[1]*b[1]+a[2]*b[2])),w=Math.acos(dot),sw=Math.sin(w)||1;
  const k=(1+.26*Math.sin(Math.PI*t)*Math.min(1,w/1.2));return[0,1,2].map(i=>(Math.sin((1-t)*w)*a[i]+Math.sin(t*w)*b[i])/sw*k)};
 let fl=0,ci=0;
 function planeAt(p,q){const ang=Math.atan2(q.y-p.y,q.x-p.x);g.save();g.translate(p.x,p.y);g.rotate(ang);g.fillStyle="#fff3c4";g.shadowColor="#ffd56b";g.shadowBlur=10;
  g.beginPath();g.moveTo(8,0);g.lineTo(-5,-5.500);g.lineTo(-2.500,0);g.lineTo(-5,5.500);g.closePath();g.fill();g.restore()}
 function frame(){g.clearRect(0,0,S,S);rot+=.0042;
  // sphere body
  let b=g.createRadialGradient(cx-40,cy-50,10,cx,cy,R*1.05);b.addColorStop(0,"#22336f");b.addColorStop(.6,"#0d1638");b.addColorStop(1,"#070b22");
  g.fillStyle=b;g.beginPath();g.arc(cx,cy,R,0,6.283);g.fill();
  // atmosphere rim
  let r=g.createRadialGradient(cx,cy,R*.9,cx,cy,R*1.16);r.addColorStop(0,"rgba(120,160,255,0)");r.addColorStop(.55,"rgba(120,160,255,.35)");r.addColorStop(1,"rgba(120,160,255,0)");
  g.fillStyle=r;g.beginPath();g.arc(cx,cy,R*1.16,0,6.283);g.fill();
  // dots
  dots.forEach(d=>{const p=P(d);if(p.z>0){g.fillStyle=`rgba(200,220,255,${.15+.5*p.z})`;g.fillRect(p.x-.8,p.y-.8,1.6,1.6)}else{g.fillStyle="rgba(150,170,255,.08)";g.fillRect(p.x-.5,p.y-.5,1,1)}});
  // grid
  g.lineWidth=.6;
  for(let lo=0;lo<360;lo+=30){g.beginPath();let on=false;for(let la=-90;la<=90;la+=6){const p=P(v(la,lo));if(p.z>0){on?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y);on=true}else on=false}g.strokeStyle="rgba(150,180,255,.22)";g.stroke()}
  for(let la=-60;la<=60;la+=30){g.beginPath();let on=false;for(let lo=0;lo<=360;lo+=6){const p=P(v(la,lo));if(p.z>0){on?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y);on=true}else on=false}g.strokeStyle="rgba(150,180,255,.18)";g.stroke()}
  // route arcs (all faint, current bright)
  cities.forEach((c,i)=>{g.beginPath();let on=false;for(let t=0;t<=1.001;t+=.02){const p=P(arc(TAS,c.a,t));if(p.z>-.05){on?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y);on=true}else on=false}
   g.strokeStyle=i===ci?"rgba(255,224,138,.85)":"rgba(255,224,138,.16)";g.lineWidth=i===ci?1.6:.8;g.setLineDash(i===ci?[]:[3,4]);g.stroke();g.setLineDash([])});
  // pins
  const pulse=(Math.sin(performance.now()/380)+1)/2;
  [{a:TAS,main:1},...cities.map(c=>({a:c.a}))].forEach(o=>{const p=P(o.a);if(p.z<=0)return;
   g.fillStyle=o.main?"#ffe08a":"rgba(255,224,138,.9)";g.beginPath();g.arc(p.x,p.y,o.main?3.5:2.2,0,6.283);g.fill();
   if(o.main){g.strokeStyle=`rgba(255,224,138,${.7-pulse*.6})`;g.lineWidth=1.4;g.beginPath();g.arc(p.x,p.y,5+pulse*11,0,6.283);g.stroke()}});
  // plane
  fl+=.007;if(fl>=1){fl=0;ci=(ci+1)%cities.length}
  const A=P(arc(TAS,cities[ci].a,fl)),B=P(arc(TAS,cities[ci].a,Math.min(1,fl+.02)));if(A.z>-.05)planeAt(A,B);
  requestAnimationFrame(frame)}
 frame()})();
</script>
