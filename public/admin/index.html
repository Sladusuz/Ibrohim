<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel — IMPRO</title>
  <link rel="icon" href="/assets/img/logo1.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="/admin/admin.css" rel="stylesheet">
</head>
<body>

  <!-- Login screen -->
  <div id="loginScreen" class="login-wrap hidden">
    <form id="loginForm" class="login-card">
      <h1>Admin Panel</h1>
      <p class="sub">IMPRO portfolio boshqaruv paneli</p>
      <label for="username">Login</label>
      <input type="text" id="username" name="username" autocomplete="username" required>
      <label for="password">Parol</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <button type="submit" class="btn-primary" id="loginBtn">Kirish</button>
      <div id="loginError" class="error-box hidden"></div>
    </form>
  </div>

  <!-- Dashboard -->
  <div id="dashboard" class="dash hidden">
    <aside class="sidebar">
      <h2>IMPRO Admin</h2>
      <p class="sub">Sayt kontentini boshqarish</p>
      <nav id="tabNav"></nav>
      <button id="logoutBtn" class="btn-sm logout">Chiqish</button>
    </aside>
    <main class="content" id="panelRoot"></main>
  </div>

  <script src="/admin/admin.js"></script>
</body>
</html>
