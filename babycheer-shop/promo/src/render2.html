const load = (k, src) => new Promise((res, rej) => { const i = new Image(); i.onload = () => { IMG[k] = i; res(); }; i.onerror = () => rej(new Error(src)); i.src = src; });

// ---------- fon va muhit ----------
const WORLD = {

  dark: { top: '#050507', bot: '#14060a', acc: '#ff2d4a', acc2: '#ffffff' }, blue: { top: '#071a6e', bot: '#2b59ff', acc: '#ffd400', acc2: '#ffffff' },

function bgWorld(t, w, o = {}) {

}
function vignette(a = .6) { const v = g.createRadialGradient(W / 2, H * .46, 300, W / 2, H * .46, 1250); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, `rgba(0,0,0,${a})`); g.fillStyle = v; g.fillRect(0, 0, W, H); }

// ---------- matn ----------
function txt(s, x, y, size, o = {}) {

  g.save(); g.font = F(weight, size); if (ls) g.letterSpacing = ls + 'px'; const w = g.measureText(s).width, k = Math.min(1, maxW / w) * sc; g.translate(x, y); g.rotate(rot); g.scale(k, k); g.globalAlpha = a; g.textAlign = align; g.textBaseline = 'middle'; g.lineJoin = 'round';

function reveal(s, t, t0, x, y, size, o = {}) { // pastdan siljib chiqish (maska bilan)
  const k = E.out5(u(t, t0, .38)); if (k <= 0) return; const { fill = '#fff', stroke = null, lw = 0, h = size * 1.15, maxW = 1000, align = 'center' } = o;

function captions(t, s, y, w) {

    const ch = s.chunks[ci], nxt = s.chunks[ci + 1], a = ch[0].a - .03, b = Math.min(ch[ch.length - 1].b + .18, nxt ? nxt[0].a - .05 : 1e9); if (t < a || t > b) continue; const k = E.out(u(t, a, .2)), fade = t > b - .1 ? clamp((b - t) / .1) : 1;

    const words = ch.map((o) => ({ t: o.w.toUpperCase().replace(/[.,!?]+$/, ''), cur: t >= o.a && t < o.b })), gap = 30, pad = 22; words.forEach((q) => { q.w = g.measureText(q.t).width; });
    const tot = words.reduce((m, q) => m + q.w, 0) + gap * (words.length - 1), sc = Math.min(1, 940 / tot) * (.92 + .08 * k);
    g.translate(W / 2, y + (1 - k) * 26); g.scale(sc, sc); let x = -tot / 2; g.textBaseline = 'middle';

      g.fillStyle = q.cur ? '#0a0f2c' : '#fff'; if (!q.cur) { g.shadowColor = 'rgba(0,0,0,.7)'; g.shadowBlur = 22; g.shadowOffsetY = 6; } g.fillText(q.t, x, 3); g.shadowColor = 'transparent'; x += q.w + gap;
    }

}

// ---------- sahnalar ----------
const wt = (s, i) => s.wt[Math.min(i, s.wt.length - 1)];
