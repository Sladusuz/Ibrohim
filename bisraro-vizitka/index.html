<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>BISRARO — vizitka</title>
<style>
/* Vizitka: 90×50 mm + har tomondan 2 mm bleed = 94×54 mm.
   Muhim matn va QR chetdan kamida 5 mm ichkarida (xavfsiz zona). */
@font-face{font-family:Fraunces;src:url(fonts/fraunces.woff2) format('woff2');font-weight:100 900}
@font-face{font-family:Manrope;src:url(fonts/manrope.woff2) format('woff2');font-weight:200 800}
:root{--ink:#1A120B;--cocoa:#3E2418;--gold:#C9A24B;--gold-l:#E8CD82;--gold-d:#8E6B24;--cream:#F5E9DA;--milk:#FFF8F0;
  --foil:linear-gradient(115deg,#8E6B24 0%,#E8CD82 26%,#FFF3C9 38%,#C9A24B 52%,#8E6B24 68%,#E8CD82 86%,#C9A24B 100%)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0b0704}
body{font-family:Manrope,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
@page{size:94mm 54mm;margin:0}
.sheet{position:relative;width:94mm;height:54mm;overflow:hidden;page-break-after:always;break-after:page}
.sheet:last-child{page-break-after:auto;break-after:auto}
.foil{background:var(--foil);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.25em;margin-bottom:-.25em}

/* umumiy fon */
.dark{background:radial-gradient(90mm 60mm at 18% 40%,#4A2B1C 0%,#2A1A10 45%,#150D07 100%)}
.pattern{position:absolute;inset:0;opacity:.09}
.frame{position:absolute;inset:4.2mm;border:.18mm solid rgba(232,205,130,.45);border-radius:2.4mm}
.frame::before,.frame::after{content:"";position:absolute;width:3mm;height:3mm;border:.35mm solid var(--gold-l)}
.frame::before{left:-.9mm;top:-.9mm;border-right:0;border-bottom:0}
.frame::after{right:-.9mm;bottom:-.9mm;border-left:0;border-top:0}

/* ---------- OLD TOMON ---------- */
.front .logo{position:absolute;left:9.5mm;top:50%;width:27mm;height:27mm;margin-top:-13.5mm;border-radius:50%;
  background:var(--milk);box-shadow:0 0 0 .5mm #2A1A10,0 0 0 .85mm var(--gold),0 1.5mm 4mm rgba(0,0,0,.6);overflow:hidden}
.front .logo img{width:100%;height:100%;object-fit:cover;transform:scale(1.05)}
.front .ring{position:absolute;left:6mm;top:50%;width:34mm;height:34mm;margin-top:-17mm}
.front .ring text{font:700 2.05px Manrope;letter-spacing:.62px;fill:var(--gold-l)}
.front .brand{position:absolute;left:44mm;right:7mm;top:14.2mm;text-align:left}
.front h1{font-family:Fraunces,serif;font-weight:600;font-size:7.6mm;letter-spacing:.07em;line-height:1;white-space:nowrap}
.front .rule{display:flex;align-items:center;gap:1.4mm;margin:2.6mm 0 2.3mm;width:38mm}
.front .rule i{display:block;flex:1 1 0;height:0;border-top:.3mm solid var(--gold);-webkit-mask-image:linear-gradient(90deg,#000,rgba(0,0,0,.15));mask-image:linear-gradient(90deg,#000,rgba(0,0,0,.15))}
.front .rule i:first-child{-webkit-mask-image:linear-gradient(270deg,#000,rgba(0,0,0,.15));mask-image:linear-gradient(270deg,#000,rgba(0,0,0,.15))}
.front .rule b{flex:none;width:1.5mm;height:1.5mm;transform:rotate(45deg);background:var(--foil)}
.front .sub{font-weight:800;font-size:2.35mm;letter-spacing:.42em;color:var(--gold-l)}
.front .meta{margin-top:1.6mm;font-weight:500;font-size:2.05mm;letter-spacing:.12em;color:rgba(245,233,218,.62)}
.front .medal{position:absolute;right:8.2mm;bottom:7.3mm;font-size:1.65mm;font-weight:700;letter-spacing:.18em;color:rgba(232,205,130,.75)}

/* ---------- ORQA TOMON ---------- */
.back .qrbox{position:absolute;left:8mm;top:50%;width:34mm;height:34mm;margin-top:-17mm}
.back .tile{position:absolute;inset:2.4mm;border-radius:2.2mm;background:var(--milk);box-shadow:0 1.2mm 3mm rgba(0,0,0,.55);padding:1.2mm}
.back .tile svg{display:block;width:100%;height:100%}
.back .corners{position:absolute;inset:0}
.back .corners i{position:absolute;width:6mm;height:6mm;border:.55mm solid var(--gold-l);border-radius:.6mm}
.back .corners i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-top-left-radius:2.6mm}
.back .corners i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-top-right-radius:2.6mm}
.back .corners i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-bottom-left-radius:2.6mm}
.back .corners i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-bottom-right-radius:2.6mm}
.back .laser{position:absolute;left:1.6mm;right:1.6mm;top:44%;height:.45mm;border-radius:1mm;
  background:linear-gradient(90deg,transparent,var(--gold-l) 20%,#FFF3C9 50%,var(--gold-l) 80%,transparent);box-shadow:0 0 1.6mm .4mm rgba(232,205,130,.75);opacity:.9}
.back .info{position:absolute;left:47mm;right:7.5mm;top:9.6mm}
.back .kicker{display:flex;align-items:center;gap:1.3mm;font-weight:800;font-size:1.75mm;letter-spacing:.3em;color:var(--gold)}
.back .kicker svg{width:3.1mm;height:3.1mm}
.back h2{margin-top:1.3mm;font-family:Fraunces,serif;font-weight:600;font-size:6.4mm;line-height:.95;letter-spacing:.02em}
.back .hint{margin-top:1.5mm;font-size:1.95mm;line-height:1.35;color:rgba(245,233,218,.72);font-weight:500}
.back ul{list-style:none;margin-top:3.1mm;display:grid;gap:1.25mm}
.back li{display:flex;align-items:center;gap:1.6mm;font-size:2.2mm;font-weight:700;color:var(--cream);letter-spacing:.02em;white-space:nowrap}
.back li span{display:grid;place-items:center;flex:none;width:3.5mm;height:3.5mm;border-radius:50%;background:rgba(232,205,130,.14);color:var(--gold-l)}
.back li svg{width:2.1mm;height:2.1mm}
.back .arrow{position:absolute;left:39.2mm;top:12.2mm;width:9mm;height:9mm;color:var(--gold-l)}

/* ---------- ALOHIDA QR (kvadrat) ---------- */
.qrsheet{width:120mm;height:150mm;position:relative;overflow:hidden}
.qrsheet .card{position:absolute;left:12mm;right:12mm;top:12mm;bottom:12mm;border-radius:8mm;background:var(--milk);
  box-shadow:0 0 0 1.2mm var(--gold),0 0 0 2.2mm #2A1A10}
.qrsheet .qr{position:absolute;left:12mm;right:12mm;top:12mm;aspect-ratio:1}
.qrsheet .qr svg{width:100%;height:100%;display:block}
.qrsheet .lbl{position:absolute;left:0;right:0;bottom:9mm;text-align:center}
.qrsheet .pill{display:inline-flex;align-items:center;gap:3mm;padding:3.2mm 7mm;border-radius:20mm;background:#2A1A10;color:var(--gold-l);
  font-weight:800;font-size:6mm;letter-spacing:.24em}
.qrsheet .pill svg{width:7mm;height:7mm}
.qrsheet .url{margin-top:2.8mm;font-size:3.6mm;font-weight:700;letter-spacing:.08em;color:#6B3F2A}
</style>
</head>
