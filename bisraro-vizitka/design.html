<style>

@font-face{font-family:Fraunces;src:url(fonts/fraunces.woff2) format('woff2');font-weight:100 900}

  --line:rgba(232,205,130,.45);--chip:rgba(232,205,130,.14);--pat:#E8CD82;--pat-op:.08;

  --foil:linear-gradient(115deg,#8C4E47 0%,#E7B3A2 26%,#FFE6DA 38%,#C98B7B 52%,#8C4E47 68%,#E7B3A2 86%,#C98B7B 100%)}

  /* 5. Tungi ko'k & shampan */
  --bg1:#1F3456;--bg2:#101E36;--bg3:#060C19;
  --acc:#CDB57E;--acc-t:#EBDDB5;--text:#EEF1F6;--muted:rgba(238,241,246,.64);
  --line:rgba(235,221,181,.42);--chip:rgba(235,221,181,.13);--pat:#EBDDB5;--pat-op:.07;
  --qb:#EBDDB5;--tile:#FBF9F4;--qr-d:#0E1B31;--qr-i:#9A8250;--logo-edge:#101E36;--shadow:rgba(0,0,0,.6);
  --foil:linear-gradient(115deg,#8A7444 0%,#E6D6A8 26%,#FFF7E0 38%,#C9B27A 52%,#8A7444 68%,#E6D6A8 86%,#C9B27A 100%)}
.t-terracotta{
  /* 6. Terrakota & mis */
  --bg1:#A4492B;--bg2:#6E2A17;--bg3:#35120A;

  --line:rgba(239,216,145,.42);--chip:rgba(239,216,145,.14);--pat:#EFD891;--pat-op:.08;
  --qb:#EFD891;--tile:#FCF9F2;--qr-d:#23103C;--qr-i:#9A7A34;--logo-edge:#2C1449;--shadow:rgba(0,0,0,.6);

  /* 8. Samarqand firuzasi & oltin */
  --bg1:#127A8A;--bg2:#0A4E5C;--bg3:#04262E;

  --line:rgba(242,220,154,.45);--chip:rgba(242,220,154,.15);--pat:#F2DC9A;--pat-op:.09;

.t-graphite{
  /* 9. Grafit & kumush */
  --bg1:#4A4E55;--bg2:#2B2E33;--bg3:#131417;
  --acc:#BFC5CC;--acc-t:#E6EAEE;--text:#F2F4F6;--muted:rgba(242,244,246,.64);

.t-blush{
  /* 10. Och pushti & rose gold (och fon) */
  --bg1:#FDF1EE;--bg2:#F7E1DB;--bg3:#EDCCC3;
  --acc:#A86454;--acc-t:#94503F;--text:#3B1F1A;--muted:rgba(59,31,26,.64);
  --line:rgba(168,100,84,.45);--chip:rgba(168,100,84,.12);--pat:#B5715F;--pat-op:.1;
  --qb:#F4D2C4;--tile:#FFFFFF;--qr-d:#3B1F1A;--qr-i:#A86454;--logo-edge:#FDF1EE;--shadow:rgba(120,60,50,.22);
  --foil:linear-gradient(115deg,#7E3F31 0%,#C98470 28%,#E6A996 40%,#A35E4D 55%,#7E3F31 70%,#C98470 88%,#A35E4D 100%)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0b0704}
body{font-family:Manrope,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
@page{size:94mm 54mm;margin:0}
.sheet{position:relative;width:94mm;height:54mm;overflow:hidden;page-break-after:always;break-after:page}
.sheet:last-child{page-break-after:auto;break-after:auto}
.foil{background:var(--foil);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.25em;margin-bottom:-.25em}

/* umumiy fon */
.dark{background:radial-gradient(90mm 60mm at 18% 40%,var(--bg1) 0%,var(--bg2) 45%,var(--bg3) 100%)}
.pattern{position:absolute;inset:0;opacity:var(--pat-op)}
#girih *{stroke:var(--pat)}
.qb{fill:var(--qb,#E8CD82)}.qd,.qi{fill:var(--qr-d)}.qi{fill:var(--qr-i)}.qe{stroke:var(--qr-d)}.ql{fill:var(--qr-d);stroke:var(--qr-i)}
.frame{position:absolute;inset:4.2mm;border:.18mm solid var(--line);border-radius:2.4mm}
.frame::before,.frame::after{content:"";position:absolute;width:3mm;height:3mm;border:.35mm solid var(--acc-t)}
.frame::before{left:-.9mm;top:-.9mm;border-right:0;border-bottom:0}
.frame::after{right:-.9mm;bottom:-.9mm;border-left:0;border-top:0}

/* ---------- OLD TOMON ---------- */
.front .logo{position:absolute;left:9mm;top:50%;width:28mm;height:28mm;margin-top:-14mm;border-radius:50%;box-shadow:0 1.5mm 4mm var(--shadow)}
.front .logo svg{display:block;width:100%;height:100%}
.front .ring{position:absolute;left:6mm;top:50%;width:34mm;height:34mm;margin-top:-17mm}
.front .ring text{font:700 2.05px Manrope;letter-spacing:.62px;fill:var(--acc-t)}
.front .brand{position:absolute;left:44mm;right:7mm;top:14.2mm;text-align:left}
.front h1{font-family:Fraunces,serif;font-weight:600;font-size:7.6mm;letter-spacing:.07em;line-height:1;white-space:nowrap}
.front .rule{display:flex;align-items:center;gap:1.4mm;margin:2.6mm 0 2.3mm;width:38mm}
.front .rule i{display:block;flex:1 1 0;height:0;border-top:.3mm solid var(--acc);-webkit-mask-image:linear-gradient(90deg,#000,rgba(0,0,0,.15));mask-image:linear-gradient(90deg,#000,rgba(0,0,0,.15))}
.front .rule i:first-child{-webkit-mask-image:linear-gradient(270deg,#000,rgba(0,0,0,.15));mask-image:linear-gradient(270deg,#000,rgba(0,0,0,.15))}
.front .rule b{flex:none;width:1.5mm;height:1.5mm;transform:rotate(45deg);background:var(--foil)}
.front .sub{font-weight:800;font-size:2.35mm;letter-spacing:.42em;color:var(--acc-t)}
.front .meta{margin-top:1.6mm;font-weight:500;font-size:2.05mm;letter-spacing:.12em;color:var(--muted)}
.front .medal{position:absolute;right:8.2mm;bottom:7.3mm;font-size:1.65mm;font-weight:700;letter-spacing:.18em;color:var(--acc-t);opacity:.8}

/* ---------- ORQA TOMON ---------- */
.back .qrbox{position:absolute;left:8mm;top:50%;width:34mm;height:34mm;margin-top:-17mm}
.back .tile{position:absolute;inset:2.4mm;border-radius:2.2mm;background:var(--tile);box-shadow:0 0 0 .15mm var(--line),0 1.2mm 3mm var(--shadow);padding:1.2mm}
.back .tile svg{display:block;width:100%;height:100%}
.back .corners{position:absolute;inset:0}
.back .corners i{position:absolute;width:6mm;height:6mm;border:.55mm solid var(--acc-t);border-radius:.6mm}
.back .corners i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-top-left-radius:2.6mm}
.back .corners i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-top-right-radius:2.6mm}
.back .corners i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-bottom-left-radius:2.6mm}
.back .corners i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-bottom-right-radius:2.6mm}
.back .info{position:absolute;left:47mm;right:7.5mm;top:9.6mm}
.back .kicker{display:flex;align-items:center;gap:1.3mm;font-weight:800;font-size:1.75mm;letter-spacing:.3em;color:var(--acc)}
.back .kicker svg{width:3.1mm;height:3.1mm}
.back h2{margin-top:1.3mm;font-family:Fraunces,serif;font-weight:600;font-size:6.4mm;line-height:.95;letter-spacing:.02em}
.back .hint{margin-top:1.5mm;font-size:1.95mm;line-height:1.35;color:var(--muted);font-weight:500}
.back ul{list-style:none;margin-top:3.1mm;display:grid;gap:1.25mm}
.back li{display:flex;align-items:center;gap:1.6mm;font-size:2.2mm;font-weight:700;color:var(--text);letter-spacing:.02em;white-space:nowrap}
.back li span{display:grid;place-items:center;flex:none;width:3.5mm;height:3.5mm;border-radius:50%;background:var(--chip);color:var(--acc-t)}
.back li svg{width:2.1mm;height:2.1mm}
.back .arrow{position:absolute;left:39.2mm;top:12.2mm;width:9mm;height:9mm;color:var(--acc-t)}

/* ---------- ALOHIDA QR (kvadrat) ---------- */
.qrsheet{width:120mm;height:150mm;position:relative;overflow:hidden}
.qrsheet .card{position:absolute;left:12mm;right:12mm;top:12mm;bottom:12mm;border-radius:8mm;background:var(--tile);
  box-shadow:0 0 0 1.2mm var(--acc),0 0 0 2.2mm var(--bg2)}
.qrsheet .qr{position:absolute;left:12mm;right:12mm;top:12mm;aspect-ratio:1}
.qrsheet .qr svg{width:100%;height:100%;display:block}
.qrsheet .lbl{position:absolute;left:0;right:0;bottom:9mm;text-align:center}
.qrsheet .pill{display:inline-flex;align-items:center;gap:3mm;padding:3.2mm 7mm;border-radius:20mm;background:var(--qr-d);color:var(--acc-t);
  font-weight:800;font-size:6mm;letter-spacing:.24em}
.qrsheet .pill svg{width:7mm;height:7mm}
.qrsheet .url{margin-top:2.8mm;font-size:3.6mm;font-weight:700;letter-spacing:.08em;color:var(--qr-i)}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8E6B24"/><stop offset=".4" stop-color="#FFF3C9"/><stop offset=".7" stop-color="#C9A24B"/><stop offset="1" stop-color="#8E6B24"/></linearGradient>
    <!-- sharqona geometrik naqsh (8 qirrali yulduz) -->
    <pattern id="girih" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M6 0l1.76 4.24L12 6l-4.24 1.76L6 12l-1.76-4.24L0 6l4.24-1.76z" fill="none" stroke="#E8CD82" stroke-width=".35"/>
      <rect x="3.5" y="3.5" width="5" height="5" transform="rotate(45 6 6)" fill="none" stroke="#E8CD82" stroke-width=".25"/>
      <circle cx="0" cy="0" r="1" fill="none" stroke="#E8CD82" stroke-width=".25"/><circle cx="12" cy="12" r="1" fill="none" stroke="#E8CD82" stroke-width=".25"/>
      <circle cx="12" cy="0" r="1" fill="none" stroke="#E8CD82" stroke-width=".25"/><circle cx="0" cy="12" r="1" fill="none" stroke="#E8CD82" stroke-width=".25"/>
    </pattern>
    <symbol id="i-scan" viewBox="0 0 24 24"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3M7 12h10" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.8 2z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></symbol>
    <symbol id="i-ig" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2.4"/></symbol>
    <symbol id="i-web" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M2.5 12h19M12 2.5c2.6 2.8 3.8 6 3.8 9.5s-1.2 6.7-3.8 9.5c-2.6-2.8-3.8-6-3.8-9.5S9.4 5.3 12 2.5z" fill="none" stroke="currentColor" stroke-width="2.2"/></symbol>
  </defs>
</svg>

<!-- ============ OLD TOMON ============ -->
<section class="sheet front dark" data-view="front">
  <svg class="pattern" width="100%" height="100%"><rect width="100%" height="100%" fill="url(#girih)"/></svg>
  <div class="frame"></div>
  <svg class="ring" viewBox="0 0 34 34">
    <defs><path id="rc" d="M17,17 m-15.4,0 a15.4,15.4 0 1,1 30.8,0 a15.4,15.4 0 1,1 -30.8,0"/></defs>
    <text><textPath href="#rc">BISRARO • PREMIUM CHOCOLATE • SINCE 2016 • TASHKENT •</textPath></text>
  </svg>
  <div class="logo">%%LOGO%%</div>
  <div class="brand">
    <h1 class="foil">BISRARO</h1>
    <div class="rule"><i></i><b></b><i></i></div>
    <div class="sub">PREMIUM CHOCOLATE</div>
    <div class="meta">HEALTHY FOOD PRODUCTION</div>
  </div>
  <div class="medal">PRODEXPO 2023 · GOLD MEDAL</div>
</section>

<!-- ============ ORQA TOMON ============ -->
<section class="sheet back dark" data-view="back">
  <svg class="pattern" width="100%" height="100%"><rect width="100%" height="100%" fill="url(#girih)"/></svg>
  <div class="frame"></div>
  <div class="qrbox">
    <div class="tile">%%QR%%</div>
    <div class="corners"><i></i><i></i><i></i><i></i></div>
  </div>
  <svg class="arrow" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M36 6c-8 1-20 6-24 22" stroke-dasharray="2.5 3"/><path d="M6.5 22.5L11.5 29l6-4.8"/>
  </svg>
  <div class="info">
    <div class="kicker"><svg><use href="#i-scan"/></svg>SCAN ME</div>
    <h2 class="foil">Skanerlang</h2>
    <p class="hint">Kamerani QR kodga qarating —<br>barcha kontaktlarimiz bir joyda</p>
    <ul>
      <li><span><svg><use href="#i-phone"/></svg></span>+998 97 777 44 40</li>
      <li><span><svg><use href="#i-ig"/></svg></span>@bisraro.uz</li>
      <li><span><svg><use href="#i-web"/></svg></span>bisraro.uz</li>
    </ul>
  </div>
</section>

<!-- ============ ALOHIDA QR ============ -->
<section class="qrsheet dark" data-view="qr">
  <svg class="pattern" width="100%" height="100%"><rect width="100%" height="100%" fill="url(#girih)"/></svg>
  <div class="card">
    <div class="qr">%%QR%%</div>
    <div class="lbl">
      <div class="pill"><svg><use href="#i-scan"/></svg>SKANERLANG</div>
      <div class="url">bisraro.uz/contacts</div>
    </div>
  </div>
</section>

<script>
/* ?view=front | back | qr — faqat bitta qismni ko'rsatadi (render uchun)
   ?theme=cocoa | ivory | emerald | burgundy | midnight — rang varianti */
var q = new URLSearchParams(location.search), v = q.get('view');
document.body.className = 't-' + (q.get('theme') || 'cocoa');
if (v) document.querySelectorAll('[data-view]').forEach(function(s){ if (s.dataset.view !== v) s.remove(); });
</script>
</body>
