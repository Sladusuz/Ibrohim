  const SV = (d, w = 1.8) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
  const IC = {
    site: SV('<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18"/><path d="M7 6.5h.01M10 6.5h.01"/>'),
    bag: SV('<path d="M6 7h12l1 13H5L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/>'),
    inbox: SV('<path d="M3 13l3-8h12l3 8"/><path d="M3 13v6h18v-6h-5a4 4 0 0 1-8 0H3z"/>'),
    user: SV('<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>'),
    plus: SV('<path d="M12 5v14M5 12h14"/>', 2.4),
    edit: SV('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>', 2),
    trash: SV('<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/>', 2),
    ext: SV('<path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>', 2),
    gift: SV('<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M5 12v8h14v-8"/><path d="M12 8a3 3 0 1 0-3-3c0 1.7 3 3 3 3zm0 0a3 3 0 1 1 3-3c0 1.7-3 3-3 3z"/>'),
    bot: SV('<path d="M22 3L2 11l7 3 3 7 3-5 7-13z"/><path d="M9 14l13-11"/>'),
    spark: SV('<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 17l.7 1.8L21.5 19.5l-1.8.7L19 22l-.7-1.8-1.8-.7 1.8-.7z"/>'),
    home: SV('<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>'),
    search: SV('<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>', 2),
    out: SV('<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>', 2),
    dollar: SV('<path d="M12 2v20"/><path d="M17 6.5C16 5 14.2 4 12 4c-2.8 0-5 1.4-5 3.5S9 11 12 11.5 17 13.3 17 15.5 14.8 20 12 20c-2.4 0-4.3-1-5.3-2.5"/>')
  };
  const num = (n) => Number(n).toLocaleString('ru-RU');
  const main = $('#main');
  if (!A || !A.enabled) { main.innerHTML = '<div class="emptyk"><b>Kabinet hozircha ishlamayapti</b><p style="margin-top:6px">Hisob funksiyasi server ulanganda ishlaydi.</p></div>'; return; }
  await A.init();
  if (!A.user()) { const u = await A.modal({ closable: false, title: 'Kabinetga kiring', text: "Hisobingiz bo'lmasa, ro'yxatdan o'ting." }); if (!u) return; }
  document.querySelectorAll('[data-out]').forEach((b) => { b.onclick = () => { A.logout(); location.href = '/'; }; });
  let tab = 'sites', projects = [], orders = [], leads = [], ref = null;
  async function load() { try { [projects, orders, leads] = await Promise.all([A.request('/api/my/projects'), A.request('/api/my/orders'), A.request('/api/my/leads')]); } catch (e) { toast(e.message); } try { ref = await A.request('/api/my/referral'); } catch { ref = null; } draw(); }
  const STEPS = [['qoralama', 'Qoralama'], ['yuborilgan', 'Yuborilgan'], ['narx', 'Narx'], ['joylandi', 'Joylandi']];
  const stepIdx = (s) => s === 'korilmoqda' ? 1 : Math.max(0, STEPS.findIndex((x) => x[0] === s));
  let shellDone = false;
  function shell(u) {
    const first = String(u.name || '').split(' ')[0] || 'do\'st', ini = (String(u.name || '?').trim()[0] || '?').toUpperCase();
    const cnt = { sites: projects.length, orders: orders.length, leads: leads.length };
    if (shellDone) {
      document.querySelectorAll('[data-t]').forEach((b) => { if (b.closest('#main')) return; b.classList.toggle('on', b.dataset.t === tab); });
      document.querySelectorAll('[data-n]').forEach((i) => { const n = cnt[i.dataset.n]; i.textContent = n; i.hidden = !n && i.closest('#bnav') != null; });
      return first;
    }
    const N = (k, ic, l, n) => `<button class="nvl ${tab === k ? 'on' : ''}" data-t="${k}">${ic}<span>${l}</span>${n == null ? '' : `<i data-n="${k}">${n}</i>`}</button>`;
    $('#side').innerHTML = `<a class="klg" href="/"><img src="/img/logo-mark-96.png" alt="" width="40" height="40"><span>Impro IT<small>Kabinet</small></span></a>${N('sites', IC.site, 'Saytlarim', cnt.sites)}${N('orders', IC.bag, 'Buyurtmalarim', cnt.orders)}${N('leads', IC.inbox, 'Mijoz so\'rovlari', cnt.leads)}${N('prof', IC.user, 'Profil')}<div class="sep"></div><div class="cap">Tezkor</div><a class="nvl" href="/yaratish.html">${IC.plus}<span>Sayt yaratish</span></a><a class="nvl" href="/bot.html">${IC.bot}<span>Telegram bot</span></a><a class="nvl" href="/">${IC.home}<span>Bosh sahifa</span></a><div class="usr"><div class="kav">${esc(ini)}</div><div><b>${esc(u.name)}</b><span>${esc(u.email || u.phone || '')}</span></div><button class="kout" data-out title="Chiqish" aria-label="Chiqish">${IC.out}</button></div>`;
    $('#mtop').innerHTML = `<a class="klg" href="/"><img src="/img/logo-mark-96.png" alt="" width="34" height="34"><span>Impro IT</span></a><button class="kav" data-t="prof" aria-label="Profil" style="border:0;cursor:pointer">${esc(ini)}</button><button class="kout" data-out aria-label="Chiqish">${IC.out}</button>`;
    const B = (k, ic, l, n) => `<button data-t="${k}" class="${tab === k ? 'on' : ''}">${ic}<span>${l}</span>${n == null ? '' : `<i data-n="${k}"${n ? '' : ' hidden'}>${n}</i>`}</button>`;
    $('#bnav').innerHTML = `${B('sites', IC.site, 'Saytlar', cnt.sites)}${B('orders', IC.bag, 'Buyurtma', cnt.orders)}<a class="fab" href="/yaratish.html" aria-label="Yangi sayt">${IC.plus}</a>${B('leads', IC.inbox, 'So\'rovlar', cnt.leads)}${B('prof', IC.user, 'Profil')}`;
    document.querySelectorAll('[data-out]').forEach((b) => { b.onclick = () => { A.logout(); location.href = '/'; }; });
    shellDone = true; return first;
  }
  function draw() {
    const u = A.user(), first = shell(u), ini = (String(u.name || '?').trim()[0] || '?').toUpperCase();
    const pub = projects.filter((p) => p.published).length;
    const empty = (ico, h, p, btn) => `<div class="emp rise"><div class="eic">${ico}</div><h3>${h}</h3><p>${p}</p>${btn || ''}</div>`;
    const card = (p, i) => { const si = stepIdx(p.status), bad = p.status === 'bekor'; return `<article class="site spot rise" style="--i:${i}" data-name="${esc(String(p.name).toLowerCase())}"><div class="thumb" style="background-image:url('/img/tpl/${esc(p.template)}.jpg')"><span class="badge s-${esc(p.status)}">${esc(PS[p.status] || p.status)}</span>${p.paid ? '<span class="chip pd">To\'langan</span>' : ''}</div><div class="sbd"><h3>${esc(p.name)}</h3><div class="meta">${esc(TPL[p.template] || p.template || '')} · ${esc(fmt(p.updatedAt))}</div>${bad ? '' : `<div class="stp">${STEPS.map((s, k) => `<i class="${k < si ? 'd' : k === si ? (si === 3 ? 'd' : 'c') : ''}"></i>`).join('')}</div><div class="stl">${STEPS.map((s, k) => `<span class="${k <= si ? 'on' : ''}">${s[1]}</span>`).join('')}</div>`}${p.published && p.url ? `<a class="chip" style="align-self:flex-start;margin-top:10px" href="${esc(p.url)}" target="_blank" rel="noopener">${IC.ext.replace('<svg', '<svg width="13" height="13"')} ${esc(p.url.replace(/^https?:\/\//, ''))}</a>` : ''}${p.price ? `<div class="note"><b>Impro IT narxi: ${esc(p.price)}</b>${p.adminNote ? `<br>${esc(p.adminNote)}` : ''}</div>` : (p.adminNote ? `<div class="note">${esc(p.adminNote)}</div>` : '')}<div class="acx"><a class="kb-btn sm" href="/yaratish.html?p=${esc(p.id)}">${IC.edit} Tahrirlash</a><button class="ic" data-del="${esc(p.id)}" title="O'chirish" aria-label="O'chirish">${IC.trash}</button></div></div></article>`; };
    const sites = projects.length ? `<div class="sh rise"><div><h2>Saytlarim</h2><p>Holat chizig'i loyiha qaysi bosqichda ekanini ko'rsatadi.</p></div>${projects.length > 2 ? `<div class="srch">${IC.search}<input id="q" type="search" placeholder="Sayt qidirish…" autocomplete="off"></div>` : ''}</div><div class="grid" id="sg">${projects.map(card).join('')}</div>`
      : empty(IC.site, 'Hali saytingiz yo\'q', 'Shablonni tanlab, birinchi saytingizni bir necha daqiqada yarating.', `<a class="kb-btn" href="/yaratish.html">${IC.plus} Sayt yaratish</a>`);
    const extra = (o) => Object.entries(o.extra || {}).map(([k, v]) => `<div class="kv">${esc(k)}: ${esc(v)}</div>`).join('');
    const items = (o) => (o.items || []).map((i) => `${esc(i.name)} × ${i.qty}`).join(', ') || esc(o.message || '');
    const kind = (o) => o.type === 'booking' ? ' · Ariza' : o.type === 'brief' ? " · Loyiha so'rovi" : o.type === 'message' ? ' · Xabar' : '';
    const ords = orders.length ? `<div class="rows">${orders.map((o, i) => `<div class="row spot rise" style="--i:${i}"><div class="rico">${IC.bag}</div><div class="rmain"><div class="rtop"><b>#${esc(o.id)}</b><span class="badge s-${esc(o.status)}">${esc(OS[o.status] || o.status)}</span></div><div class="kv">${esc(fmt(o.date))}${kind(o)}</div><div class="rit">${items(o)}</div>${extra(o)}</div>${o.total ? `<div class="rtot">${num(o.total)} so'm</div>` : ''}</div>`).join('')}</div>`
      : empty(IC.bag, 'Hali buyurtma yo\'q', 'Xizmatga buyurtma bersangiz, holati shu yerda ko\'rinib turadi.', `<a class="kb-btn gh" href="/#kontakt">Buyurtma berish</a>`);
    const lds = leads.length ? `<div class="rows">${leads.map((o, i) => `<div class="row spot rise" style="--i:${i}"><div class="rico">${IC.inbox}</div><div class="rmain"><div class="rtop"><b>${esc(o.name)}</b><span class="badge s-yuborilgan">${esc(o.site)}</span></div><div class="kv">#${esc(o.id)} · ${esc(fmt(o.date))}${o.type === 'booking' ? ' · Ariza' : o.type === 'message' ? ' · Xabar' : ''}</div><div class="rit"><a href="tel:${esc(String(o.phone).replace(/[^\d+]/g, ''))}">${esc(o.phone)}</a></div><div class="rit">${items(o)}</div>${extra(o)}</div>${o.total ? `<div class="rtot">${num(o.total)} so'm</div>` : ''}</div>`).join('')}</div>`
      : empty(IC.inbox, 'Hozircha so\'rov yo\'q', 'Saytingizni joylagach, mijozlaringizning buyurtma va xabarlari shu yerda paydo bo\'ladi.');
    const refbox = ref && ref.enabled ? `<div class="pnl ref wide spot rise"><h3>${IC.gift.replace('<svg', '<svg width="20" height="20" style="vertical-align:-4px;margin-right:8px;color:var(--gold)"')}Do'stlarni taklif qiling</h3><p class="sub" style="color:#cdbf9f">Bonus dasturi</p><p>Havolangiz orqali ro'yxatdan o'tgan do'stingiz birinchi xaridga <b>${esc(String(ref.discountPct))}% chegirma</b> oladi, siz esa u sotib olgach <b>$${esc(String(ref.rewardUsd))}</b> bonus olasiz (keyingi xaridda ishlatiladi).</p><div class="fd" style="margin-top:0"><input id="refl" type="text" readonly value="${esc(ref.link)}"></div><div class="rrow"><button class="kb-btn" id="refcopy">Havolani nusxalash</button><a class="kb-btn gh" target="_blank" rel="noopener" href="https://t.me/share/url?url=${encodeURIComponent(ref.link)}&text=${encodeURIComponent("Tayyor sayt $10 dan: ")}">Telegramda yuborish</a></div><div class="rst"><div><b>${ref.invited}</b><small>Taklif qilinganlar</small></div><div><b>${ref.rewarded}</b><small>Xarid qilganlar</small></div><div><b>$${esc(String(ref.credit))}</b><small>Bonus balans</small></div></div></div>` : '';
    const filled = [u.name, u.phone, u.email].filter((v) => String(v || '').trim()).length, pct = Math.round(filled / 3 * 100);
    const prof = `<div class="pg">${refbox}<div class="pnl spot rise" style="--i:1"><div class="who"><div class="kav">${esc(ini)}</div><div><b>${esc(u.name)}</b><span>${esc(u.email || u.phone || '')}</span></div><div class="ring" title="Profil to'liqligi"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="27" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="6"/><circle cx="32" cy="32" r="27" fill="none" stroke="#d9b46a" stroke-width="6" stroke-linecap="round" stroke-dasharray="${(169.6 * pct / 100).toFixed(1)} 170"/></svg><b>${pct}%</b></div></div><h3>Profil ma'lumotlari</h3><p class="sub">Aloqa uchun ishlatiladi.</p><div class="fd"><label>Ism</label><input id="pn" type="text" value="${esc(u.name)}" maxlength="80"></div><div class="fd"><label>Telefon</label><input id="pp" type="text" value="${esc(u.phone)}" maxlength="30"></div><div class="fd"><label>Email</label><input id="pe" type="text" value="${esc(u.email)}" maxlength="120"></div><div class="mk" id="pm"></div><button class="kb-btn" id="psave">Saqlash</button></div>
      <div class="pnl spot rise" style="--i:2"><h3>Xavfsizlik</h3><p class="sub">Parolni vaqti-vaqti bilan yangilab turing.</p><div class="fd"><label>Joriy parol</label><input id="o1" type="password" autocomplete="current-password"></div><div class="fd"><label>Yangi parol</label><input id="o2" type="password" autocomplete="new-password" placeholder="Kamida 6 belgi"></div><div class="mk" id="qm"></div><button class="kb-btn gh" id="qsave">Parolni yangilash</button></div>
      <div class="pnl spot rise wide" style="--i:3"><div class="help"><div class="rico">${IC.spark}</div><div style="flex:1;min-width:200px"><h3 style="margin:0">Yordam kerakmi?</h3><p class="sub" style="margin:2px 0 0">Telegramda yozing, mutaxassis javob beradi.</p></div><a class="kb-btn gh" href="https://t.me/improsupport_bot" target="_blank" rel="noopener">@improsupport_bot</a></div></div></div>`;
    let hero = '';
    if (tab === 'sites') {
      const draft = projects.find((p) => p.status === 'qoralama'), priced = projects.find((p) => p.status === 'narx');
      const nx = !projects.length ? [IC.spark, 'Birinchi saytingizni yarating', 'Shablon tanlang, matnni o\'zgartiring, natijani jonli ko\'ring.', '/yaratish.html', 'Boshlash']
        : draft ? [IC.edit, `«${esc(draft.name)}» qoralamada`, 'Tahrirlashni tugatib, saytni yuboring yoki joylang.', `/yaratish.html?p=${esc(draft.id)}`, 'Davom etish']
        : priced ? [IC.dollar, `«${esc(priced.name)}» uchun narx belgilandi`, 'Narxni ko\'rib chiqing va Telegramda tasdiqlang.', 'https://t.me/improsupport_bot', 'Tasdiqlash']
        : leads.length ? [IC.inbox, `${leads.length} ta mijoz so'rovi bor`, 'Mijozlaringiz yozgan xabar va buyurtmalarni ko\'ring.', '#leads', 'Ko\'rish']
        : [IC.bot, 'Telegram bot qo\'shing', 'Bot mijozlarga kechayu kunduz o\'zi javob beradi.', '/bot.html', 'Bot yaratish'];
      hero = `<section class="hero rise"><i class="bl b1"></i><i class="bl b2"></i><div class="eyebrow">Shaxsiy kabinet</div><h1>Salom, <em>${esc(first)}</em></h1><p>Saytlaringiz, buyurtmalaringiz va mijozlaringizning so'rovlari bir joyda.</p><div class="hrow"><a class="kb-btn" href="/yaratish.html">${IC.plus} Yangi sayt</a><a class="kb-btn gh" href="/bot.html">${IC.bot} Telegram bot</a></div></section>
      <div class="stats">${[[IC.site, projects.length, 'Saytlar'], [IC.ext, pub, 'Joylangan'], [IC.inbox, leads.length, 'Mijoz so\'rovlari'], [IC.gift, ref && ref.enabled ? '$' + ref.credit : orders.length, ref && ref.enabled ? 'Bonus balans' : 'Buyurtmalar']].map((s, i) => `<div class="stat spot rise" style="--i:${i + 1}"><div class="si">${s[0]}</div><b data-c="${esc(String(s[1]))}">${esc(String(s[1]))}</b><small>${s[2]}</small></div>`).join('')}</div>
      <div class="next rise" style="--i:5"><div class="ni">${nx[0]}</div><div class="t"><b>${nx[1]}</b><span>${nx[2]}</span></div>${nx[3] === '#leads' ? `<button class="kb-btn sm" data-t="leads">${nx[4]}</button>` : `<a class="kb-btn sm" href="${nx[3]}"${/^http/.test(nx[3]) ? ' target="_blank" rel="noopener"' : ''}>${nx[4]}</a>`}</div>`;
    } else {
      const T = { orders: ['Buyurtmalarim', 'Impro IT xizmatlariga bergan buyurtmalaringiz.'], leads: ['Mijoz so\'rovlari', 'Saytlaringiz orqali kelgan buyurtma va xabarlar.'], prof: ['Profil', 'Ma\'lumotlaringiz, xavfsizlik va bonus dasturi.'] }[tab];
      hero = `<div class="pt rise"><h1>${T[0]}</h1><p>${T[1]}</p></div><div style="height:22px"></div>`;
    }
    main.innerHTML = hero + (tab === 'sites' ? sites : tab === 'orders' ? ords : tab === 'leads' ? lds : prof);
    // hisoblagich animatsiyasi
    main.querySelectorAll('[data-c]').forEach((el) => { const raw = el.dataset.c, n = parseFloat(raw.replace(/[^\d.]/g, '')); if (!n || n > 9999) return; const pre = raw.match(/^\D*/)[0]; const t0 = performance.now(); (function s(t) { const k = Math.min(1, (t - t0) / 900), e = 1 - Math.pow(1 - k, 3); el.textContent = pre + (Number.isInteger(n) ? Math.round(n * e) : (n * e).toFixed(1)); if (k < 1) requestAnimationFrame(s); })(t0); });
  }
  main.addEventListener('mousemove', (e) => { const s = e.target.closest('.spot'); if (!s) return; const r = s.getBoundingClientRect(); s.style.setProperty('--mx', (e.clientX - r.left) + 'px'); s.style.setProperty('--my', (e.clientY - r.top) + 'px'); });
  main.addEventListener('input', (e) => { if (e.target.id !== 'q') return; const v = e.target.value.trim().toLowerCase(); document.querySelectorAll('#sg .site').forEach((c) => { c.style.display = !v || c.dataset.name.includes(v) ? '' : 'none'; }); });
  document.addEventListener('click', (e) => { const b = e.target.closest('[data-t]'); if (b && !main.contains(b) && b.dataset.t && b.dataset.t !== tab) { tab = b.dataset.t; window.scrollTo(0, 0); draw(); } });
  main.addEventListener('click', async (e) => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.dataset.t) { if (t.dataset.t !== tab) { tab = t.dataset.t; window.scrollTo(0, 0); draw(); } }
    if (t.dataset.del && confirm("Bu sayt o'chirilsinmi? Qaytarib bo'lmaydi.")) { try { await A.request(`/api/my/projects/${t.dataset.del}`, { method: 'DELETE' }); projects = projects.filter((p) => p.id !== t.dataset.del); draw(); toast("O'chirildi"); } catch (er) { toast(er.message); } }
    if (t.id === 'refcopy') { const i = $('#refl'); try { await navigator.clipboard.writeText(i.value); } catch { i.select(); document.execCommand('copy'); } toast('Nusxalandi'); }
    if (t.id === 'psave') { const m = $('#pm'); m.className = 'mk'; try { const j = await A.request('/api/me', { method: 'PUT', body: { name: $('#pn').value, phone: $('#pp').value, email: $('#pe').value } }); A._set(j.user, null); m.className = 'mk okk'; m.textContent = 'Saqlandi'; } catch (er) { m.className = 'mk bad'; m.textContent = er.message; } }
    if (t.id === 'qsave') { const m = $('#qm'); m.className = 'mk'; try { await A.request('/api/me/password', { method: 'POST', body: { old: $('#o1').value, password: $('#o2').value } }); m.className = 'mk okk'; m.textContent = 'Parol yangilandi'; $('#o1').value = $('#o2').value = ''; } catch (er) { m.className = 'mk bad'; m.textContent = er.message; } }
  });
  load();
})();
</script>
<script src="/native.js" defer></script></body>
</html>
