<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"><link rel="preconnect" href="https://impro-bot.impro-6c9a2d.workers.dev" crossorigin>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0a09">
<title>Mening kabinetim · Impro IT</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="/ui.css">
<style>
:root{--bg:#0b0a09;--s1:#14120f;--s2:#1b1813;--line:rgba(255,255,255,.08);--line2:rgba(217,180,106,.28);--tx:#f4efe6;--mut:#9d9588;--gold:#d9b46a;--gold2:#a8802f;--ok:#5fd394;--bad:#ff7a7a;--blue:#7fb2ff;--vio:#b39bff}
*{box-sizing:border-box}
body.kb{margin:0;min-height:100vh;background:radial-gradient(900px 500px at 85% -10%,rgba(217,180,106,.13),transparent 60%),radial-gradient(700px 500px at -10% 30%,rgba(122,92,255,.08),transparent 60%),var(--bg);color:var(--tx);font-family:Inter,system-ui,'Segoe UI',Arial,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}button{font-family:inherit;cursor:pointer}
.kh{position:sticky;top:0;z-index:20;background:rgba(11,10,9,.78);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.khi{max-width:1080px;margin:0 auto;padding:0 20px;height:66px;display:flex;align-items:center;gap:14px}
.klg{display:flex;align-items:center;gap:11px;text-decoration:none;font-weight:700;font-size:17px;letter-spacing:-.01em}.klg img{width:36px;height:36px;border-radius:10px;box-shadow:0 0 0 1px rgba(217,180,106,.4)}
.knav{margin-left:auto;display:flex;align-items:center;gap:6px}.knav a{color:var(--mut);text-decoration:none;font-size:14px;font-weight:500;padding:8px 14px;border-radius:99px;transition:.2s}.knav a:hover{color:var(--tx);background:rgba(255,255,255,.06)}
.kuser{display:flex;align-items:center;gap:10px;margin-left:8px;padding:5px 6px 5px 5px;border:1px solid var(--line);border-radius:99px;background:rgba(255,255,255,.03)}
.kav{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1204;font-weight:800;font-size:13px;display:grid;place-items:center;flex:none}
.kuser span{font-size:13.5px;font-weight:600;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kout{border:0;background:rgba(255,255,255,.07);color:var(--mut);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;transition:.2s}.kout:hover{background:rgba(255,122,122,.18);color:var(--bad)}.kout svg{width:16px;height:16px}
.wrap{max-width:1080px;margin:0 auto;padding:30px 20px 90px}
.hero{position:relative;overflow:hidden;border-radius:28px;padding:34px 36px;background:linear-gradient(135deg,#1d1810 0%,#14110c 55%,#1a1530 130%);border:1px solid var(--line2);display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.hero:before{content:'';position:absolute;right:-120px;top:-140px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(217,180,106,.28),transparent 65%);pointer-events:none}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}.eyebrow:before{content:'';width:22px;height:1px;background:var(--gold)}
.hero h1{margin:12px 0 6px;font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:clamp(38px,6vw,58px);line-height:1.02;letter-spacing:-.02em}.hero h1 em{color:var(--gold);font-style:italic}
.hero p{margin:0;color:var(--mut);max-width:540px}
.hst{display:flex;gap:28px;margin-top:22px;flex-wrap:wrap}.hst div b{display:block;font-size:26px;font-weight:700;letter-spacing:-.02em}.hst div small{color:var(--mut);font-size:12.5px;font-weight:500}
.kb-btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:0;border-radius:14px;padding:13px 22px;font-weight:700;font-size:14.5px;text-decoration:none;color:#1a1204;background:linear-gradient(135deg,#ecc983,var(--gold) 45%,var(--gold2));box-shadow:0 10px 30px -10px rgba(217,180,106,.7);transition:.2s;white-space:nowrap}
.kb-btn:hover{transform:translateY(-1px);filter:brightness(1.06)}.kb-btn svg{width:17px;height:17px}.kb-btn.gh{background:rgba(255,255,255,.07);color:var(--tx);box-shadow:none;border:1px solid var(--line)}.kb-btn.gh:hover{background:rgba(255,255,255,.12)}.kb-btn.sm{padding:9px 15px;font-size:13.5px;border-radius:11px}
.tabs{display:flex;flex-wrap:nowrap;gap:4px;margin:26px 0 22px;padding:5px;background:var(--s1);border:1px solid var(--line);border-radius:18px;width:max-content;max-width:100%;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--mut);font-weight:600;font-size:14px;padding:10px 16px;border-radius:13px;white-space:nowrap;transition:.2s}.tabs button svg{width:17px;height:17px}.tabs button:hover{color:var(--tx)}
.tabs button.on{background:linear-gradient(135deg,rgba(217,180,106,.22),rgba(217,180,106,.1));color:var(--gold);box-shadow:inset 0 0 0 1px var(--line2)}.tabs i{font-style:normal;font-size:11.5px;font-weight:700;background:rgba(255,255,255,.09);color:var(--tx);border-radius:99px;padding:1px 8px}.tabs button.on i{background:var(--gold);color:#1a1204}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.site{background:var(--s1);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;transition:.25s}.site:hover{border-color:var(--line2);transform:translateY(-3px);box-shadow:0 24px 50px -24px rgba(0,0,0,.8)}
.thumb{position:relative;aspect-ratio:16/10;background:linear-gradient(135deg,#241d10,#15120d) center top/cover no-repeat}.thumb:after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(20,18,15,.95))}
.thumb .badge{position:absolute;left:14px;top:14px;z-index:1}.thumb .pd{position:absolute;right:14px;top:14px;z-index:1;background:rgba(15,13,10,.82);backdrop-filter:blur(8px);border:1px solid rgba(95,211,148,.35)}
.sb{padding:18px 20px 20px;display:flex;flex-direction:column;gap:6px;flex:1}.sb h3{margin:0;font-size:19px;letter-spacing:-.01em;font-weight:700}.meta{color:var(--mut);font-size:13px}
.note{margin-top:8px;border:1px solid var(--line2);background:rgba(217,180,106,.07);border-radius:13px;padding:10px 13px;font-size:13px;color:#e8d9b6}.note b{color:var(--gold)}
.acts{display:flex;gap:8px;margin-top:auto;padding-top:14px}.acts .kb-btn{flex:1}.ic{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--mut);width:42px;border-radius:11px;display:grid;place-items:center;transition:.2s;flex:none}.ic:hover{color:var(--bad);border-color:rgba(255,122,122,.4);background:rgba(255,122,122,.1)}.ic svg{width:17px;height:17px}
.badge{display:inline-flex;align-items:center;gap:7px;border-radius:99px;padding:5px 12px;font-size:12px;font-weight:700;background:rgba(15,13,10,.72);backdrop-filter:blur(8px);border:1px solid var(--line);white-space:nowrap}.badge:before{content:'';width:7px;height:7px;border-radius:50%;background:var(--c,#9d9588)}
.s-qoralama,.s-yangi{--c:#9d9588}.s-yuborilgan,.s-jarayonda{--c:var(--blue)}.s-korilmoqda{--c:#f5b94a}.s-narx{--c:var(--vio)}.s-joylandi,.s-bajarildi{--c:var(--ok)}.s-bekor{--c:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 11px;border-radius:99px;background:rgba(95,211,148,.12);color:var(--ok);text-decoration:none}
.rows{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:16px;align-items:flex-start;background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:18px 20px;transition:.2s}.row:hover{border-color:var(--line2)}
.rico{width:46px;height:46px;border-radius:14px;background:rgba(217,180,106,.12);color:var(--gold);display:grid;place-items:center;flex:none}.rico svg{width:22px;height:22px}
.rmain{flex:1;min-width:0}.rtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.rtop b{font-size:16px}.rtop .badge{background:rgba(255,255,255,.04)}
.rit{margin-top:8px;font-size:14px}.rit a{color:var(--gold);text-decoration:none}.kv{color:var(--mut);font-size:13px;margin-top:3px}
.rtot{font-weight:700;font-size:17px;white-space:nowrap;letter-spacing:-.01em}.rtot small{display:block;color:var(--mut);font-size:12px;font-weight:500;text-align:right}
.empty{text-align:center;padding:64px 24px;background:var(--s1);border:1px dashed rgba(255,255,255,.14);border-radius:24px}.empty .eic{width:64px;height:64px;margin:0 auto 18px;border-radius:20px;background:rgba(217,180,106,.1);color:var(--gold);display:grid;place-items:center}.empty .eic svg{width:30px;height:30px}.empty h3{margin:0 0 6px;font-size:20px}.empty p{margin:0 auto 20px;color:var(--mut);max-width:380px}
.pg{display:grid;grid-template-columns:1.15fr 1fr;gap:18px;align-items:start}.panel{background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:26px}.panel.wide{grid-column:1/-1}.panel h3{margin:0 0 4px;font-size:18px}.panel .sub{color:var(--mut);font-size:13.5px;margin:0 0 18px}
.who{display:flex;align-items:center;gap:16px;margin-bottom:22px;padding-bottom:22px;border-bottom:1px solid var(--line)}.who .kav{width:62px;height:62px;font-size:24px}.who b{display:block;font-size:19px}.who span{color:var(--mut);font-size:13.5px}
.fd{margin-top:14px}.fd label{display:block;font-weight:600;font-size:12.5px;color:var(--mut);letter-spacing:.04em;text-transform:uppercase;margin-bottom:7px}
.fd input{width:100%;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--tx);border-radius:13px;padding:13px 15px;font-size:15px;outline:0;transition:.2s}.fd input:focus{border-color:var(--gold);background:rgba(217,180,106,.06);box-shadow:0 0 0 4px rgba(217,180,106,.12)}.fd input[readonly]{color:var(--gold)}
.mk{font-size:13px;min-height:20px;margin-top:12px}.mk.bad{color:var(--bad)}.mk.okk{color:var(--ok)}
.ref{background:linear-gradient(135deg,rgba(217,180,106,.16),rgba(122,92,255,.12));border:1px solid var(--line2)}.ref p{color:#d9cfb8;margin:0 0 16px;font-size:14.5px}.ref p b{color:var(--gold)}
.rrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.rst{display:flex;gap:26px;flex-wrap:wrap;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}.rst div b{display:block;font-size:22px}.rst div small{color:var(--mut);font-size:12.5px}
@media(max-width:760px){.knav a{display:none}.kuser span{display:none}.kuser{padding:3px}.khi{padding:0 16px}.wrap{padding:18px 16px 70px}.hero{padding:26px 22px;border-radius:24px}.hero .kb-btn{width:100%}.pg{grid-template-columns:1fr}.panel{padding:22px}.tabs{width:100%}.tabs button{flex:1;justify-content:center;padding:10px 12px}.tabs button .tl{display:none}.tabs button.on{flex:1 0 auto}.tabs button.on .tl{display:inline}.row{flex-wrap:wrap}.rtot{width:100%}.rtot small{text-align:left;display:inline;margin-left:8px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body class="kb">
<header class="kh"><div class="khi"><a class="klg" href="/"><img src="/img/logo-mark-96.png" alt="" width="36" height="36"><span>Impro IT</span></a>
<nav class="knav"><a href="/yaratish.html">Sayt yaratish</a><a href="/bot.html">Telegram bot</a><a href="/">Bosh sahifa</a>
<div class="kuser" id="ku" hidden><div class="kav" id="kav"></div><span id="kun"></span><button class="kout" id="out" title="Chiqish" aria-label="Chiqish"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></button></div></nav></div></header>
<div class="wrap" id="main"><div class="empty"><h3>Yuklanmoqda…</h3></div></div>
<div class="toast" id="toast"></div>
<script src="/config.js"></script>
<script src="/icons.js"></script>
<script src="/auth.js"></script>
<script>
(async function () {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s), A = window.Auth;
  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const toast = (m) => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2600); };
  const PS = { qoralama: 'Qoralama', yuborilgan: 'Yuborilgan', korilmoqda: "Ko'rib chiqilmoqda", narx: 'Narx belgilandi', joylandi: 'Joylandi', bekor: 'Bekor qilindi' };
  const OS = { yangi: 'Yangi', jarayonda: 'Jarayonda', bajarildi: 'Bajarildi', bekor: 'Bekor qilindi' };
  const TPL = { market: 'Onlayn market', dizayner: 'Portfolio: dizayner', dasturchi: 'Portfolio: dasturchi', fotograf: 'Portfolio: fotograf', kompaniya: 'IT kompaniya', restoran: 'Restoran', salon: "Go'zallik saloni", talim: "O'quv markaz" };
  const fmt = (d) => { const t = new Date(d); if (isNaN(t)) return d || ''; const p = (n) => String(n).padStart(2, '0'); return `${p(t.getDate())}.${p(t.getMonth() + 1)}.${t.getFullYear()} ${p(t.getHours())}:${p(t.getMinutes())}`; };

  const IC = {
    site: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18"/><path d="M7 6.5h.01M10 6.5h.01"/></svg>',
    bag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l1 13H5L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>',
    inbox: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13l3-8h12l3 8"/><path d="M3 13v6h18v-6h-5a4 4 0 0 1-8 0H3z"/></svg>',
    user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
    plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg>',
    ext: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
    gift: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M5 12v8h14v-8"/><path d="M12 8a3 3 0 1 0-3-3c0 1.7 3 3 3 3zm0 0a3 3 0 1 1 3-3c0 1.7-3 3-3 3z"/></svg>'
  };
  const num = (n) => Number(n).toLocaleString('ru-RU');
  const main = $('#main');
  if (!A || !A.enabled) { main.innerHTML = '<div class="emptyk"><b>Kabinet hozircha ishlamayapti</b><p style="margin-top:6px">Hisob funksiyasi server ulanganda ishlaydi.</p></div>'; return; }
  await A.init();
  if (!A.user()) { const u = await A.modal({ closable: false, title: 'Kabinetga kiring', text: "Hisobingiz bo'lmasa, ro'yxatdan o'ting." }); if (!u) return; }
  $('#ku').hidden = false; $('#out').onclick = () => { A.logout(); location.href = '/'; };
  let tab = 'sites', projects = [], orders = [], leads = [], ref = null;
  async function load() { try { [projects, orders, leads] = await Promise.all([A.request('/api/my/projects'), A.request('/api/my/orders'), A.request('/api/my/leads')]); } catch (e) { toast(e.message); } try { ref = await A.request('/api/my/referral'); } catch { ref = null; } draw(); }
  function draw() {
    const u = A.user(), first = String(u.name || '').split(' ')[0] || 'do\'st', ini = (String(u.name || '?').trim()[0] || '?').toUpperCase();
    $('#kav').textContent = ini; $('#kun').textContent = first;
    const pub = projects.filter((p) => p.published).length;
    const empty = (ico, h, p, btn) => `<div class="empty"><div class="eic">${ico}</div><h3>${h}</h3><p>${p}</p>${btn || ''}</div>`;
    const sites = projects.length ? `<div class="grid">${projects.map((p) => `<article class="site"><div class="thumb" style="background-image:url('/img/tpl/${esc(p.template)}.jpg')"><span class="badge s-${esc(p.status)}">${esc(PS[p.status] || p.status)}</span>${p.paid ? '<span class="chip pd">To\'langan</span>' : ''}</div><div class="sb"><h3>${esc(p.name)}</h3><div class="meta">${esc(TPL[p.template] || p.template || '')} · ${esc(fmt(p.updatedAt))}</div>${p.published && p.url ? `<a class="chip" style="align-self:flex-start;margin-top:6px" href="${esc(p.url)}" target="_blank" rel="noopener">${IC.ext.replace('<svg', '<svg width="13" height="13"')} ${esc(p.url.replace(/^https?:\/\//, ''))}</a>` : ''}${p.price ? `<div class="note"><b>Impro IT narxi: ${esc(p.price)}</b>${p.adminNote ? `<br>${esc(p.adminNote)}` : ''}</div>` : (p.adminNote ? `<div class="note">${esc(p.adminNote)}</div>` : '')}<div class="acts"><a class="kb-btn sm" href="/yaratish.html?p=${esc(p.id)}">${IC.edit} Tahrirlash</a><button class="ic" data-del="${esc(p.id)}" title="O'chirish" aria-label="O'chirish">${IC.trash}</button></div></div></article>`).join('')}</div>`
      : empty(IC.site, 'Hali saytingiz yo\'q', 'Shablonni tanlab, birinchi saytingizni bir necha daqiqada yarating.', `<a class="kb-btn" href="/yaratish.html">${IC.plus} Sayt yaratish</a>`);
    const extra = (o) => Object.entries(o.extra || {}).map(([k, v]) => `<div class="kv">${esc(k)}: ${esc(v)}</div>`).join('');
    const items = (o) => (o.items || []).map((i) => `${esc(i.name)} × ${i.qty}`).join(', ') || esc(o.message || '');
    const kind = (o) => o.type === 'booking' ? ' · Ariza' : o.type === 'brief' ? " · Loyiha so'rovi" : o.type === 'message' ? ' · Xabar' : '';
    const ords = orders.length ? `<div class="rows">${orders.map((o) => `<div class="row"><div class="rico">${IC.bag}</div><div class="rmain"><div class="rtop"><b>#${esc(o.id)}</b><span class="badge s-${esc(o.status)}">${esc(OS[o.status] || o.status)}</span></div><div class="kv">${esc(fmt(o.date))}${kind(o)}</div><div class="rit">${items(o)}</div>${extra(o)}</div>${o.total ? `<div class="rtot">${num(o.total)} so'm</div>` : ''}</div>`).join('')}</div>`
      : empty(IC.bag, 'Hali buyurtma yo\'q', 'Xizmatga buyurtma bersangiz, holati shu yerda ko\'rinib turadi.', `<a class="kb-btn gh" href="/#kontakt">Buyurtma berish</a>`);
    const lds = leads.length ? `<div class="rows">${leads.map((o) => `<div class="row"><div class="rico">${IC.inbox}</div><div class="rmain"><div class="rtop"><b>${esc(o.name)}</b><span class="badge s-yuborilgan">${esc(o.site)}</span></div><div class="kv">#${esc(o.id)} · ${esc(fmt(o.date))}${o.type === 'booking' ? ' · Ariza' : o.type === 'message' ? ' · Xabar' : ''}</div><div class="rit"><a href="tel:${esc(String(o.phone).replace(/[^\d+]/g, ''))}">${esc(o.phone)}</a></div><div class="rit">${items(o)}</div>${extra(o)}</div>${o.total ? `<div class="rtot">${num(o.total)} so'm</div>` : ''}</div>`).join('')}</div>`
      : empty(IC.inbox, 'Hozircha so\'rov yo\'q', 'Saytingizni joylagach, mijozlaringizning buyurtma va xabarlari shu yerda paydo bo\'ladi.');
    const refbox = ref && ref.enabled ? `<div class="panel ref wide"><h3>${IC.gift.replace('<svg', '<svg width="20" height="20" style="vertical-align:-4px;margin-right:8px;color:var(--gold)"')}Do'stlarni taklif qiling</h3><p class="sub" style="color:#cdbf9f">Bonus dasturi</p><p>Havolangiz orqali ro'yxatdan o'tgan do'stingiz birinchi xaridga <b>${esc(String(ref.discountPct))}% chegirma</b> oladi, siz esa u sotib olgach <b>$${esc(String(ref.rewardUsd))}</b> bonus olasiz (keyingi xaridda ishlatiladi).</p><div class="fd" style="margin-top:0"><input id="refl" type="text" readonly value="${esc(ref.link)}"></div><div class="rrow"><button class="kb-btn" id="refcopy">Havolani nusxalash</button><a class="kb-btn gh" target="_blank" rel="noopener" href="https://t.me/share/url?url=${encodeURIComponent(ref.link)}&text=${encodeURIComponent("Tayyor sayt $10 dan: ")}">Telegramda yuborish</a></div><div class="rst"><div><b>${ref.invited}</b><small>Taklif qilinganlar</small></div><div><b>${ref.rewarded}</b><small>Xarid qilganlar</small></div><div><b>$${esc(String(ref.credit))}</b><small>Bonus balans</small></div></div></div>` : '';
    const prof = `<div class="pg">${refbox}<div class="panel"><div class="who"><div class="kav">${esc(ini)}</div><div><b>${esc(u.name)}</b><span>${esc(u.email || u.phone || '')}</span></div></div><h3>Profil ma'lumotlari</h3><p class="sub">Aloqa uchun ishlatiladi.</p><div class="fd"><label>Ism</label><input id="pn" type="text" value="${esc(u.name)}" maxlength="80"></div><div class="fd"><label>Telefon</label><input id="pp" type="text" value="${esc(u.phone)}" maxlength="30"></div><div class="fd"><label>Email</label><input id="pe" type="text" value="${esc(u.email)}" maxlength="120"></div><div class="mk" id="pm"></div><button class="kb-btn" id="psave">Saqlash</button></div>
      <div class="panel"><h3>Xavfsizlik</h3><p class="sub">Parolni vaqti-vaqti bilan yangilab turing.</p><div class="fd"><label>Joriy parol</label><input id="o1" type="password" autocomplete="current-password"></div><div class="fd"><label>Yangi parol</label><input id="o2" type="password" autocomplete="new-password" placeholder="Kamida 6 belgi"></div><div class="mk" id="qm"></div><button class="kb-btn gh" id="qsave">Parolni yangilash</button></div></div>`;
    const T = (k, ic, l, n) => `<button data-t="${k}" class="${tab === k ? 'on' : ''}">${ic}<span class="tl">${l}</span>${n == null ? '' : `<i>${n}</i>`}</button>`;
    main.innerHTML = `<section class="hero"><div><div class="eyebrow">Shaxsiy kabinet</div><h1>Salom, <em>${esc(first)}</em></h1><p>Saytlaringiz, buyurtmalaringiz va mijozlaringizning so'rovlari bir joyda.</p><div class="hst"><div><b>${projects.length}</b><small>Saytlar</small></div><div><b>${pub}</b><small>Joylangan</small></div><div><b>${leads.length}</b><small>Mijoz so'rovlari</small></div></div></div><a class="kb-btn" href="/yaratish.html">${IC.plus} Yangi sayt</a></section>
      <nav class="tabs">${T('sites', IC.site, 'Saytlarim', projects.length)}${T('orders', IC.bag, 'Buyurtmalarim', orders.length)}${T('leads', IC.inbox, 'So\'rovlar', leads.length)}${T('prof', IC.user, 'Profil')}</nav>${tab === 'sites' ? sites : tab === 'orders' ? ords : tab === 'leads' ? lds : prof}`;
  }
  main.addEventListener('click', async (e) => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.dataset.t) { tab = t.dataset.t; draw(); }
    if (t.dataset.del && confirm("Bu sayt o'chirilsinmi? Qaytarib bo'lmaydi.")) { try { await A.request(`/api/my/projects/${t.dataset.del}`, { method: 'DELETE' }); projects = projects.filter((p) => p.id !== t.dataset.del); draw(); toast("O'chirildi"); } catch (er) { toast(er.message); } }
    if (t.id === 'refcopy') { const i = $('#refl'); try { await navigator.clipboard.writeText(i.value); } catch { i.select(); document.execCommand('copy'); } toast('Nusxalandi'); }
    if (t.id === 'psave') { const m = $('#pm'); m.className = 'mk'; try { const j = await A.request('/api/me', { method: 'PUT', body: { name: $('#pn').value, phone: $('#pp').value, email: $('#pe').value } }); A._set(j.user, null); m.className = 'mk okk'; m.textContent = 'Saqlandi'; } catch (er) { m.className = 'mk bad'; m.textContent = er.message; } }
    if (t.id === 'qsave') { const m = $('#qm'); m.className = 'mk'; try { await A.request('/api/me/password', { method: 'POST', body: { old: $('#o1').value, password: $('#o2').value } }); m.className = 'mk okk'; m.textContent = 'Parol yangilandi'; $('#o1').value = $('#o2').value = ''; } catch (er) { m.className = 'mk bad'; m.textContent = er.message; } }
  });
  load();
})();
</script>
<script src="/native.js" defer></script></body>
</html>
