<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sayt yaratish</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/ui.css">
<style>
html,body{height:100%}body.ui{display:flex;flex-direction:column;overflow:hidden}
.gal-wrap{flex:1;overflow:auto;padding:0 0 60px}
.hero2{max-width:1100px;margin:0 auto;padding:44px 24px 10px}.hero2 h1{font-size:clamp(28px,4vw,44px);letter-spacing:-.03em;line-height:1.1}.hero2 p{color:var(--muted);font-size:17px;margin-top:10px;max-width:640px}
.resume{max-width:1100px;margin:18px auto 0;padding:0 24px}.rbox{background:linear-gradient(135deg,#eef2ff,#f5f3ff);border:1px solid #d9d6fb;border-radius:16px;padding:16px 20px}.rbox.flex{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}.rbox b{font-size:15px}.rbox span{color:var(--muted);font-size:13px;display:block}.mine{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}.pcard2{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center}.pcard2 .row{display:flex;gap:6px}
.cats{max-width:1100px;margin:22px auto 0;padding:0 24px;display:flex;gap:8px;flex-wrap:wrap}.cats button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 16px;font-weight:600;font-size:13px;color:var(--muted)}.cats button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tgrid{max-width:1100px;margin:20px auto 0;padding:0 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:22px}
.tc{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;transition:.3s;box-shadow:0 1px 2px #0f172a0a}.tc:hover{transform:translateY(-5px);box-shadow:0 22px 50px #1e293b22;border-color:#c7c3f5}
.tci{position:relative;aspect-ratio:16/10;background:linear-gradient(135deg,#e0e7ff,#fce7f3);overflow:hidden}.tci img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}.tci .bd{position:absolute;top:12px;left:12px;background:#0f172a;color:#fff;border-radius:99px;padding:4px 12px;font-size:11px;font-weight:700;letter-spacing:.05em}
.tcb{padding:18px 20px 20px;display:flex;flex-direction:column;gap:8px;flex:1}.tcb small{color:var(--acc);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.08em}.tcb h3{font-size:19px}.tcb p{color:var(--muted);font-size:13.5px;flex:1}.tcb .row{display:flex;gap:8px;margin-top:6px}.tcb .row .b{flex:1}
.pvm{display:flex;flex-direction:column;height:100%}.pvh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}.pvh b{font-size:16px}.pvm iframe{flex:1;border:0;width:100%}
.plans{display:grid;gap:10px;margin-top:10px}.plan2{border:1.5px solid var(--line);border-radius:14px;padding:14px;position:relative}.plan2.pop{border-color:var(--acc);background:var(--soft)}.plan2 b{font-size:15px}.plan2 .pr{font-size:18px;font-weight:800;margin:2px 0}.plan2 .pr small{font-size:12px;color:var(--muted);font-weight:500}.plan2 ul{list-style:none;color:var(--muted);font-size:12.5px;margin-top:6px}.plan2 li:before{content:'✓ ';color:var(--ok);font-weight:800}
.fld2{margin-top:12px}.fld2 label{display:block;font-weight:600;font-size:13px;margin-bottom:5px}.msg{font-size:13px;margin-top:10px;min-height:18px}.msg.bad{color:var(--bad)}.msg.okk{color:var(--ok)}
.guide{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px;font-size:13px;color:var(--muted)}.guide ol{padding-left:18px;margin-top:6px;display:grid;gap:3px}
@media(max-width:560px){.tgrid{grid-template-columns:1fr}}
</style>
</head>
<body class="ui">
<header class="top"><a class="lg" href="/"><span class="m">I</span><span class="t" id="brand">Impro IT</span></a>
<div class="tb" id="tbar" hidden><span id="ttl" style="font-weight:700;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span><div class="dev"><button class="on" data-d="d">Kompyuter</button><button data-d="m">Telefon</button></div><button class="b g s" id="btnTpl">Shablonlar</button><span class="st" id="st">● Saqlandi</span><button class="b" id="btnDone">Tayyor ✓</button></div>
<div class="tb" id="gbar"><a class="b g s" href="/">← Bosh sahifa</a></div></header>

<div class="gal-wrap" id="gallery">
  <div class="hero2"><h1>Saytingizni o'zingiz yarating</h1><p>Kasbingizga mos shablonni tanlang. Matn, rasm, narx va ranglarni o'zgartiring, natijani darrov ko'ring va tayyor saytni yuklab oling.</p></div>
  <div class="resume" id="resume" hidden></div>
  <div class="cats" id="cats"></div>
  <div class="tgrid" id="tgrid"></div>
</div>

  <div class="side"><div class="tabs" id="tabs"></div><div class="panel" id="panel"></div></div>

</div>
