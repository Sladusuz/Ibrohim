<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sayt konstruktori</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#f1f3f9;--card:#fff;--ink:#0f172a;--muted:#5b6478;--line:#e3e6f0;--acc:#4f46e5;--acc2:#7c3aed;--ok:#16a34a;--bad:#dc2626}
*{box-sizing:border-box;margin:0}body{font-family:Inter,system-ui,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:column;font-size:14px}
button{font-family:inherit;cursor:pointer}[hidden]{display:none!important}
.top{height:62px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:12px;flex:none}
.lg{font-weight:800;display:flex;gap:10px;align-items:center;font-size:16px;white-space:nowrap}.m{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;display:grid;place-items:center}
.tb{display:flex;gap:10px;align-items:center}.dev{background:#eef0f9;border-radius:10px;padding:4px;display:flex;gap:2px}.dev button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-size:13px;color:var(--muted)}.dev button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px #0002}
.st{font-size:13px;font-weight:600;color:var(--ok);white-space:nowrap}.st.dirty{color:#d97706}.st.bad{color:var(--bad)}
.b{border:0;border-radius:10px;padding:10px 18px;font-weight:600;font-size:14px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}.b:disabled{opacity:.5;cursor:default}
.b.g{background:#eef0f9;color:var(--ink)}.b.s{padding:7px 12px;font-size:13px}.b.d{background:#fee2e2;color:var(--bad)}
.main{flex:1;display:flex;min-height:0}.side{width:410px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;flex:none}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}.tabs button{border:0;padding:8px 13px;border-radius:99px;background:#f1f3f9;font-size:13px;font-weight:600;color:var(--muted);position:relative}.tabs button.on{background:var(--acc);color:#fff}
.tabs .cnt{background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:1px 6px;margin-left:5px}
.panel{flex:1;overflow:auto;padding:6px 18px 40px}
h4{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:22px 0 4px}
.hint{font-size:12.5px;color:var(--muted);margin:2px 0 8px}
label.f{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
input[type=text],input[type=number],input[type=password],input[type=email],textarea,select{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;background:#fff;color:var(--ink);outline:0}
input:focus,textarea:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px #4f46e51f}textarea{resize:vertical;min-height:70px}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;margin-top:10px;cursor:pointer}.sw b{font-size:14px}.sw small{display:block;color:var(--muted);font-size:12px;font-weight:400;margin-top:2px}
.sw input{display:none}.tg{width:44px;height:25px;border-radius:99px;background:#d6dbe8;position:relative;flex:none;transition:.2s}.tg:after{content:'';position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.2s}.sw input:checked+.tg{background:var(--acc)}.sw input:checked+.tg:after{left:22px}
.th{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}.th button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px;font-size:12px;font-weight:600}.th button.on{border-color:var(--acc)}.th i{display:block;height:44px;border-radius:8px;margin-bottom:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.colors{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.colors label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}input[type=color]{width:42px;height:34px;border:1.5px solid var(--line);border-radius:8px;padding:2px;background:#fff}
.item{border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-top:12px;background:#fafbff}.item .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}.item .hd b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acts{display:flex;gap:4px}.acts button{border:0;background:#eef0f9;border-radius:8px;width:30px;height:30px;font-size:14px}.acts button:hover{background:#dfe3f3}.acts .x:hover{background:#fee2e2;color:var(--bad)}
.addb{width:100%;margin-top:12px;border:2px dashed #cfd5e4;background:transparent;border-radius:12px;padding:12px;font-weight:600;color:var(--acc)}.addb:hover{background:#f4f3ff}
.img{display:flex;gap:12px;align-items:center;margin-top:6px}.img .pv{width:84px;height:56px;border-radius:10px;background:#eef0f9 center/cover;border:1.5px solid var(--line);flex:none}
.img label{border:1.5px dashed #b9c0d8;border-radius:10px;padding:8px 12px;font-weight:600;color:var(--acc);cursor:pointer;font-size:13px;text-align:center}.img label:hover{background:#f4f3ff}.img input{display:none}
.prev{flex:1;display:grid;place-items:center;padding:20px;min-width:0}.fr{width:100%;height:100%;background:#fff;border-radius:16px;box-shadow:0 10px 40px #0002;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;transition:max-width .3s;max-width:100%}.fr.m{max-width:400px}
.fb{height:32px;background:#f1f3f9;display:flex;align-items:center;padding:0 12px;gap:6px;flex:none}.fb i{width:9px;height:9px;border-radius:50%;background:#cfd5e4}.fb s{margin-left:12px;flex:1;background:#fff;border-radius:6px;height:20px;text-decoration:none;font-size:11px;color:#8a93a8;padding:3px 10px}
iframe{flex:1;border:0;width:100%}
.ord{border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}.ord .h{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}.ord b{font-size:15px}.ord ul{margin:8px 0 8px 18px;color:var(--muted)}.ord .a{display:flex;gap:8px;margin-top:10px}.ord select{width:auto;padding:7px 10px}
.empty{color:var(--muted);padding:30px 0;text-align:center}
.login{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:50;padding:20px}.lbox{background:#fff;border-radius:22px;padding:34px;width:min(400px,100%);box-shadow:0 20px 60px #0002}.lbox h2{margin:14px 0 6px;font-size:22px}.lbox p{color:var(--muted);margin-bottom:18px}.lbox .b{width:100%;margin-top:14px;padding:13px}.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:#0f172a;color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;transition:.35s;z-index:99;opacity:0}.toast.show{transform:translateX(-50%);opacity:1}
@media(max-width:900px){.main{flex-direction:column}.side{width:100%;height:58%;border-right:0;border-bottom:1px solid var(--line)}.prev{padding:8px}.dev,.st{display:none}.lg span.t{display:none}}
</style>
</head>
<body>
<div class="login" id="login" hidden><div class="lbox"><div class="m" style="width:44px;height:44px;font-size:20px">I</div><h2>Sayt konstruktori</h2><p>Davom etish uchun admin parolini kiriting.</p>
<form id="lf"><input type="password" id="pw" placeholder="Parol" autocomplete="current-password" autofocus><div class="err" id="le"></div><button class="b">Kirish</button></form></div></div>
<header class="top"><div class="lg"><span class="m" id="lm">I</span><span class="t">Sayt konstruktori</span></div>
<div class="tb"><div class="dev"><button class="on" data-d="d">Kompyuter</button><button data-d="m">Telefon</button></div><a class="b g s" href="/" target="_blank" rel="noopener">Saytni ochish ↗</a><span class="st" id="st">● Saqlangan</span><button class="b" id="save">Saqlash</button></div></header>
<div class="main"><div class="side"><div class="tabs" id="tabs"></div><div class="panel" id="panel"></div></div>
<div class="prev"><div class="fr" id="fr"><div class="fb"><i></i><i></i><i></i><s>Sayt ko'rinishi (jonli)</s></div><iframe id="if" src="/?preview=1" title="Sayt ko'rinishi"></iframe></div></div></div>
<div class="toast" id="toast"></div>
<script src="/icons.js"></script>
<script src="/admin.js"></script>
</body></html>
