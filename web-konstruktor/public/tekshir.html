<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Aloqa tekshiruvi | Impro IT</title>
<style>body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#0c0c10;color:#f4f2ee;padding:18px;max-width:560px;margin:auto}h1{font-size:21px}.r{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:12px;background:#17161d;margin:8px 0;border:1px solid #ffffff18}.r b{font-weight:600}.ok{color:#5fd68a}.bad{color:#ff6b6b}.w{color:#e8c77f}button{width:100%;padding:15px;border:0;border-radius:12px;background:#d8b46a;color:#15110a;font-weight:800;font-size:16px;margin-top:12px}small{color:#9a96a8}pre{white-space:pre-wrap;background:#17161d;border-radius:12px;padding:12px;font-size:13px}</style></head><body>
<h1>Aloqa tekshiruvi</h1><p><small>Sayt yoki kirish ishlamasa, shu sahifa sababini ko'rsatadi. Natijani skrinshot qilib yuboring.</small></p>
<div id="o"></div><button id="b">Qayta tekshirish</button><pre id="i"></pre>
<script src="/config.js"></script>
<script>
var API=String(window.__API__||'').replace(/\/$/,'');
var T=[['Sayt (improuzbekiston.uz)',location.origin+'/favicon.svg'],['Server: narxlar',API+'/api/pricing'],['Server: kirish API',API+'/api/auth/login','POST'],['Shriftlar (Google)','https://fonts.googleapis.com/css2?family=Inter&display=swap','no-cors']];
function row(n,t,c,m){return '<div class="r"><b>'+n+'</b><span class="'+c+'">'+t+(m?' · '+m:'')+'</span></div>'}
async function one(t){var s=performance.now(),ac=new AbortController(),tm=setTimeout(function(){ac.abort()},20000);try{var o={signal:ac.signal,cache:'no-store'};if(t[2]==='POST'){o.method='POST';o.headers={'Content-Type':'application/json'};o.body=JSON.stringify({id:'tekshir@test.uz',password:'tekshir-parol'})}if(t[2]==='no-cors')o.mode='no-cors';var r=await fetch(t[1]+(t[2]?'':'?t='+Date.now()),o);clearTimeout(tm);var ms=Math.round(performance.now()-s);var okk=t[2]==='no-cors'||r.status<500;return {ok:okk,ms:ms,st:r.status}}catch(e){clearTimeout(tm);return {ok:false,ms:Math.round(performance.now()-s),err:e&&e.name==='AbortError'?'20 soniyada javob yo\'q':'ulanib bo\'lmadi'}}}
async function run(){var h='',info=[];document.getElementById('o').innerHTML='<p>Tekshirilmoqda…</p>';
for(var i=0;i<T.length;i++){var r=await one(T[i]);var c=!r.ok?'bad':r.ms>2500?'w':'ok';var txt=r.ok?(r.ms>2500?'sekin':'yaxshi'):r.err;h+=row(T[i][0],(r.ok?'✅ ':'❌ ')+txt,c,r.ms+' ms'+(r.st?' · '+r.st:''));info.push(T[i][0]+': '+(r.ok?'ok':r.err)+' '+r.ms+'ms'+(r.st?' ('+r.st+')':''))}
document.getElementById('o').innerHTML=h;var n=navigator,c=n.connection||{};info.push('Tarmoq: '+(c.effectiveType||'?')+', yuklash '+(c.downlink||'?')+' Mbit/s, kechikish '+(c.rtt||'?')+' ms');info.push('Qurilma: xotira '+(n.deviceMemory||'?')+' GB, yadro '+(n.hardwareConcurrency||'?'));info.push(n.userAgent);document.getElementById('i').textContent=info.join('\n')}
document.getElementById('b').onclick=run;run();
</script></body></html>
