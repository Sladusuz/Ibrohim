<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Telegram bot yaratish</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/ui.css">
<style>
html,body{height:100%}body.ui{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.page{flex:1;overflow:auto}
.hero3{position:relative;overflow:hidden;color:#fff;background:#06101f;padding:48px 24px 54px;text-align:center}
.hero3:before,.hero3:after{content:'';position:absolute;width:55vw;height:55vw;border-radius:50%;filter:blur(90px);opacity:.5;animation:hf 18s ease-in-out infinite}
.hero3:before{background:#229ed9;left:-10vw;top:-28vw}.hero3:after{background:#7c5cff;right:-12vw;top:-24vw;animation-delay:-8s;opacity:.4}
@keyframes hf{50%{transform:translate(6vw,5vw) scale(1.12)}}
.hero3>*{position:relative;z-index:1}.hero3 h1{font-size:clamp(30px,5.4vw,60px);letter-spacing:-.04em;line-height:1;max-width:820px;margin:0 auto}.hero3 h1 em{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-style:italic}
.hero3 p{color:#b6c3e2;max-width:600px;margin:14px auto 0;font-size:clamp(14px,1.6vw,18px)}
.wrap3{max-width:1000px;margin:0 auto;padding:22px 20px 70px}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:-30px auto 22px;max-width:1000px;padding:0 20px;position:relative;z-index:2}.feat div{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:0 10px 30px #0f172a12}.feat b{display:block;font-size:14.5px}.feat span{color:var(--muted);font-size:12.5px}
.card3{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:14px}
.bots{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.bc{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:6px;transition:.25s}.bc:hover{transform:translateY(-3px);box-shadow:0 18px 40px #0f172a1a;border-color:#c7c3f5}
.bc .av{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#229ed9,#7c5cff);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:800}.bc b{font-size:16px}.bc small{color:var(--muted)}.bc .row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.badge3{display:inline-block;border-radius:99px;padding:2px 10px;font-size:11.5px;font-weight:700}.ok3{background:#dcfce7;color:#15803d}.w3{background:#fef3c7;color:#b45309}.g3{background:#e2e8f0;color:#334155}
.steps3{counter-reset:s;display:grid;gap:10px;margin:8px 0 4px}.steps3 li{list-style:none;position:relative;padding-left:38px;font-size:14px}.steps3 li:before{counter-increment:s;content:counter(s);position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;background:var(--soft);color:var(--acc);font-weight:800;display:grid;place-items:center;font-size:13px}
.ed3{flex:1;display:flex;min-height:0}.ed3 .side{width:460px}
.prev3{flex:1;display:grid;place-items:center;padding:18px;min-width:0;background:linear-gradient(180deg,#e8eefb,#dfe7f7);overflow:auto}
.phone{width:min(330px,100%);height:min(640px,100%);background:#0e1621;border-radius:34px;border:8px solid #1b2431;box-shadow:0 30px 70px #0f172a55;display:flex;flex-direction:column;overflow:hidden;position:relative}
.ph-h{background:#17212b;color:#fff;padding:14px 14px 12px;display:flex;gap:10px;align-items:center;flex:none}.ph-h .av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#229ed9,#7c5cff);display:grid;place-items:center;font-weight:800}.ph-h b{font-size:14px;display:block}.ph-h small{color:#7f91a4;font-size:11.5px}
.ph-b{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:#0e1621}
.msg3{max-width:86%;background:#182533;color:#fff;border-radius:14px 14px 14px 4px;padding:9px 12px;font-size:13px;white-space:pre-wrap;word-break:break-word}.msg3.me{align-self:flex-end;background:#2b5278;border-radius:14px 14px 4px 14px}
.ph-k{background:#17212b;padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:none}.ph-k span{background:#2b3a4a;color:#fff;border-radius:8px;padding:9px 6px;text-align:center;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ph-k span.wa{background:#229ed9}
.phone iframe{flex:1;border:0;background:#fff;width:100%}
.save3{position:sticky;bottom:0;background:linear-gradient(0deg,#fff 70%,#fff0);padding:14px 0 6px;display:flex;gap:10px;align-items:center}
.sub3{font-size:12.5px;color:var(--muted)}
.row3{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.it3{border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;background:#fafbff}.it3 .top3{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.pimg{width:64px;height:64px;border-radius:12px;background:#eef0f9 center/cover no-repeat;border:1.5px solid var(--line);flex:none}
.copy3{display:flex;gap:6px}.copy3 input{flex:1}
.ord3{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;background:#fff;font-size:13px}.ord3 b{font-size:14px}
@media(max-width:900px){.ed3{flex-direction:column}.ed3 .side{width:100%;height:auto;flex:1;min-height:0;border:0}.prev3{display:none}.row3{grid-template-columns:1fr}.ed3 .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;flex:none}.ed3 .tabs::-webkit-scrollbar{display:none}.ed3 .tabs button{flex:none;padding:10px 15px;font-size:14px}.ed3 .panel{padding-bottom:60px}}
</style>
</head>
<body class="ui">
<header class="top"><a class="lg" href="/"><span class="m" aria-hidden="true"></span><span class="t">Impro IT</span></a><div class="tb" id="tbar"><a class="b g s" href="/yaratish.html">Sayt yaratish</a><a class="b g s" href="/kabinet.html">Kabinet</a><a class="b g s" href="/">Bosh sahifa</a></div></header>
<div class="page" id="page"><div style="padding:80px;text-align:center;color:var(--muted)">Yuklanmoqda…</div></div>
<div class="ed3" id="editor" hidden></div>
<div class="toast" id="toast"></div>
<script src="/config.js"></script>
<script src="/icons.js"></script>
<script src="/auth.js"></script>
<script>
(async function () {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s), A = window.Auth;
  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const toast = (m) => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2800); };
  const money = (n) => Number(n || 0).toLocaleString('ru-RU').replace(/ /g, ' ');
  const page = $('#page'), editor = $('#editor');
  const fmt = (d) => { const t = new Date(d); if (isNaN(t)) return ''; const p = (n) => String(n).padStart(2, '0'); return `${p(t.getDate())}.${p(t.getMonth() + 1)} ${p(t.getHours())}:${p(t.getMinutes())}`; };
  if (!A || !A.enabled) { page.innerHTML = '<div class="wrap3"><div class="card3" style="text-align:center;padding:50px 20px"><h2>Bot konstruktori serverda ishlaydi</h2><p class="sub3" style="margin-top:8px">Hisob va botlar server ulangandan keyin ishlaydi. Server joylangach shu sahifa to\'liq ochiladi.</p></div></div>'; return; }
  await A.init();
  if (!A.user()) { const u = await A.modal({ closable: false, title: 'Bot yaratish uchun kiring', text: "Hisobingiz bo'lmasa, ro'yxatdan o'ting. Botlaringiz hisobingizda saqlanadi." }); if (!u) return; }

  let bots = [], B = null, tab = 'link', dirty = false, orders = [];
  const TABS = [['link', 'Ulanish'], ['main', 'Asosiy'], ['menu', 'Menyu'], ['cat', 'Katalog'], ['app', 'Mini ilova'], ['rep', 'Javoblar'], ['msg', 'Xabar'], ['ord', 'Buyurtmalar']];

  /* ---------- Botlar ro'yxati ---------- */
  async function loadList() { try { bots = await A.request('/api/my/bots'); } catch (e) { toast(e.message); bots = []; } drawList(); }
  function drawList() {
    editor.hidden = true; page.hidden = false;
    page.innerHTML = `<div class="hero3"><h1>Telegram <em>botingizni</em> o'zingiz yarating</h1><p>Token kiriting va sozlang: menyu, katalog, buyurtmalar va Telegram ichidagi mini do'kon. Kod yozish shart emas. Tahrirlash bepul; to'lovdan keyin bot ishga tushadi. Narx: oddiy bot $15, katalog +$20, mini ilova +$20.</p><div style="margin-top:22px"><button class="b" id="newBot" style="padding:14px 26px;font-size:15px">+ Yangi bot ulash</button></div></div>
      <div class="feat"><div><b>🛍 Katalog va savat</b><span>Mahsulotlar bot ichida, buyurtma sizga keladi</span></div><div><b>📱 Mini ilova (do'kon)</b><span>Telegram ichida chiroyli ilova</span></div><div><b>📣 Xabar yuborish</b><span>Obunachilarga yangiliklar</span></div><div><b>⚡ Avto-javoblar</b><span>Kalit so'z bo'yicha javob</span></div></div>
      <div class="wrap3">${bots.length ? `<div class="bots">${bots.map((b) => `<div class="bc"><div class="av">${esc((b.name || '?')[0].toUpperCase())}</div><b>${esc(b.name)}</b><small>@${esc(b.username)}</small><div><span class="badge3 ${b.webhook ? 'ok3' : 'w3'}">${b.webhook ? 'Ishlayapti' : 'Ulanish kutilmoqda'}</span> <span class="badge3 g3">${b.subscribers} obunachi</span> <span class="badge3 g3">${b.orders} buyurtma</span></div><div class="row"><button class="b s" data-open="${esc(b.id)}">Boshqarish</button><a class="b g s" href="${esc(b.link)}" target="_blank" rel="noopener">Telegramda ochish</a></div></div>`).join('')}</div>` : '<div class="card3" style="text-align:center;padding:40px 20px"><h3>Hali botingiz yo\'q</h3><p class="sub3" style="margin:6px 0 14px">Birinchi botingizni 2 daqiqada ulang.</p><button class="b" id="newBot2">Bot ulash</button></div>'}</div>`;
  }
  function wizard() {
    const m = document.createElement('div'); m.className = 'modalx';
    m.innerHTML = `<div class="mx" style="width:min(560px,100%);padding:24px"><h3 style="font-size:20px">Yangi bot ulash</h3><ol class="steps3" style="margin-top:12px"><li>Telegramda <b>@BotFather</b> ni oching va <b>/newbot</b> yozing.</li><li>Bot nomi va <b>username</b> (oxiri <i>bot</i> bilan tugaydi) ni kiriting.</li><li>BotFather bergan <b>tokenni</b> (<i>123456789:AA…</i>) pastga qo'ying.</li></ol><label class="f">Bot tokeni</label><input type="text" id="tok" placeholder="123456789:AAH..." autocomplete="off" spellcheck="false"><label class="f">Do'kon/biznes nomi (ixtiyoriy)</label><input type="text" id="bn" maxlength="60" placeholder="Masalan: Baraka do'koni"><div class="msg" id="wm" style="min-height:20px;font-size:13px;margin-top:8px"></div><div style="display:flex;gap:8px;margin-top:10px"><button class="b" id="wgo">Ulash</button><button class="b g" id="wno">Bekor qilish</button></div><p class="sub3" style="margin-top:12px">Token faqat serverda saqlanadi va hech qayerda ko'rsatilmaydi. Istalgan vaqt BotFather'da /revoke bilan almashtirishingiz mumkin.</p></div>`;
    document.body.appendChild(m);
    $('#wno').onclick = () => m.remove(); m.addEventListener('click', (e) => { if (e.target === m) m.remove(); });
    $('#wgo').onclick = async () => {
      const b = $('#wgo'), w = $('#wm'); w.className = 'msg'; w.textContent = ''; b.disabled = true; b.textContent = 'Tekshirilmoqda…';
      try { const r = await A.request('/api/my/bots', { method: 'POST', body: { token: $('#tok').value, name: $('#bn').value } }); m.remove(); await loadList(); B = r.bot; B.subscribers = 0; tab = 'link'; openEditor(); if (r.warn) toast(r.warn); else toast('Bot ulandi!'); }
      catch (e) { w.style.color = 'var(--bad)'; w.textContent = e.message; b.disabled = false; b.textContent = 'Ulash'; }
    };
  }

  /* ---------- Muharrir ---------- */
  const get = (o, p) => p.split('.').reduce((a, k) => (a == null ? a : a[k]), o);
  function setv(o, p, v) { const ks = p.split('.'); const last = ks.pop(); const t = ks.reduce((a, k) => a[k], o); t[last] = v; }
  const fld = (label, path, o = {}) => `<label class="f">${label}</label>${o.area ? `<textarea data-p="${path}" rows="${o.rows || 3}" maxlength="${o.max || 1500}" placeholder="${esc(o.ph || '')}">${esc(get(B.config, path))}</textarea>` : `<input type="${o.type || 'text'}" data-p="${path}" value="${esc(get(B.config, path))}" maxlength="${o.max || 200}" placeholder="${esc(o.ph || '')}">`}${o.hint ? `<div class="hint">${o.hint}</div>` : ''}`;
  async function openBot(id) {
    try { B = await A.request('/api/my/bots/' + id); tab = 'link'; dirty = false; openEditor(); } catch (e) { toast(e.message); }
  }
  function openEditor() {
    page.hidden = true; editor.hidden = false;
    editor.innerHTML = `<div class="side"><div style="padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px"><button class="b g s" id="back">← Botlar</button><b style="font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(B.name)}</b><a class="b g s" href="${esc(B.link)}" target="_blank" rel="noopener">@${esc(B.username)}</a></div><div class="tabs" id="tabs"></div><div class="panel" id="panel"></div></div><div class="prev3" id="prev3"></div>`;
    drawTabs(); drawPanel(); drawPreview();
  }
  let payInfo = null;
  function payCard() {
    const pr = B && B.price; if (!pr) return '';
    const rows = pr.items.map((i) => `<div class="chk ${i.paid ? 'ok' : 'w'}"><span>${i.paid ? '✓' : '$'}</span><span>${esc(i.label)}: <b>$${i.usd}</b>${i.paid ? " (to'langan)" : ''}</span></div>`).join('');
    if (!pr.dueUsd) return `<h4>To'lov</h4>${rows}<p class="hint">Hammasi to'langan. Yangi imkoniyat (katalog yoki mini ilova) qo'shsangiz, faqat o'sha qismi to'lanadi.</p>`;
    if (payInfo) return `<h4>To'lov</h4>${rows}<div class="chk ok" style="display:block;white-space:pre-line"><b>So'rovingiz qabul qilindi (#${esc(payInfo.payment.id)})</b>\nSumma: <b>$${esc(String(payInfo.payment.usd))}</b> (${money(payInfo.payment.uzs)} so'm)\n${window.__CARD__ ? 'Karta: ' + esc(window.__CARD__.number) + '\n' + esc(window.__CARD__.holder) : esc(payInfo.text || '')}\n\nTo'lov izohiga <b>#${esc(payInfo.payment.id)}</b> yozing. Admin tasdiqlagach bot ishga tushadi.</div><button class="b w" data-a="paycheck">To'lovni tekshirish</button>`;
    return `<h4>Narx va to'lov</h4>${rows}<div class="chk w" style="display:block;font-size:15px">Jami to'lash: <b>$${pr.dueUsd}</b> (≈ ${money(pr.uzs)} so'm)</div><div id="payarea" style="display:grid;gap:8px;margin-top:8px"><button class="b w" data-a="botbuy" data-m="manual">Kartaga o'tkazma bilan to'lash</button></div><p class="hint">${pr.active ? '' : "To'lovdan keyin bot darrov ishlaydi. "}To'lanmagan imkoniyatlar (katalog, mini ilova) to'lovgacha yopiq turadi. Tahrirlash va tekshirish bepul.</p>`;
  }
  const drawTabs = () => { $('#tabs').innerHTML = TABS.map(([k, l]) => `<button data-t="${k}" class="${tab === k ? 'on' : ''}">${l}</button>`).join(''); };
  const saveBar = () => `<div class="save3"><button class="b" data-a="save">Saqlash</button><span class="sub3" id="sv">${dirty ? "O'zgarishlar saqlanmagan" : ''}</span></div>`;
  function drawPanel() {
    const c = B.config, p = $('#panel'); let h = '';
    if (tab === 'link') {
      h = payCard() + `<h4>Holat</h4><div class="chk ${B.webhook ? 'ok' : 'w'}"><span>${B.webhook ? '✓' : '!'}</span><span>${B.webhook ? 'Bot serverga ulangan va javob beryapti' : "Bot hali serverga ulanmagan. HTTPS domen bo'lgach «Qayta ulash» ni bosing"}</span></div><div class="chk ${B.ownerLinked ? 'ok' : 'w'}"><span>${B.ownerLinked ? '✓' : '!'}</span><span>${B.ownerLinked ? 'Siz bot egasi sifatida ulangansiz: buyurtmalar Telegramingizga keladi' : "Buyurtmalar sizga kelishi uchun egasi sifatida ulaning"}</span></div>
        <h4>1. Egasi sifatida ulanish</h4><p class="hint">Quyidagi tugmani bosing, Telegram ochiladi: <b>Start</b> ni bosing. Shundan keyin yangi buyurtmalar shu chatga keladi va /stats, /orders, /broadcast buyruqlari ishlaydi.</p><a class="b w" style="display:flex" href="${esc(B.claimLink)}" target="_blank" rel="noopener">Telegramda ulanish</a>
        <h4>2. Botingizni tekshiring</h4><a class="b g w" style="display:flex" href="${esc(B.link)}" target="_blank" rel="noopener">@${esc(B.username)} ni ochish</a>
        <h4>3. Qayta ulash</h4><p class="hint">Domen yoki sozlamalar o'zgargan bo'lsa, webhook'ni qayta o'rnating.</p><button class="b g" data-a="connect">Qayta ulash</button>
        <h4>Xavfli hudud</h4><button class="b d" data-a="del">Botni o'chirish</button><p class="hint">Faqat platformadan uziladi. Bot Telegramda qoladi, uni @BotFather orqali o'chira olasiz.</p>`;
    } else if (tab === 'main') {
      h = `${fld('Do\'kon / bot nomi', 'title', { max: 60 })}${fld('Salomlashuv xabari (/start)', 'welcome', { area: 1, rows: 4, hint: "Mijoz botni birinchi ochganda ko'radi." })}${fld('Biz haqimizda', 'about', { area: 1, rows: 3 })}
        <h4>Aloqa</h4>${fld('Telefon', 'contact.phone', { max: 40 })}${fld('Manzil', 'contact.address', { max: 200 })}${fld('Ish vaqti', 'contact.hours', { max: 100 })}
        <h4>Boshqa</h4>${fld('Valyuta', 'currency', { max: 12 })}${fld('Tushunilmagan xabarga javob', 'fallback', { area: 1, rows: 2, max: 400 })}${saveBar()}`;
    } else if (tab === 'menu') {
      h = `<h4>Menyu tugmalari</h4><p class="hint">Bot pastida ko'rinadigan tugmalar (10 tagacha).</p>${c.buttons.map((b, i) => `<div class="it3"><div class="top3"><b>Tugma ${i + 1}</b><button class="b d s" data-del="buttons" data-i="${i}">O'chirish</button></div><input type="text" data-p="buttons.${i}.text" value="${esc(b.text)}" maxlength="30" placeholder="Tugma matni (emoji bilan)"><select data-p="buttons.${i}.type" style="margin-top:8px">${[['text', 'Matn bilan javob'], ['catalog', 'Katalog'], ['contact', 'Aloqa ma\'lumoti'], ['about', 'Biz haqimizda'], ['url', 'Havola ochish'], ['webapp', 'Mini ilova (do\'kon)']].map(([k, l]) => `<option value="${k}" ${b.type === k ? 'selected' : ''}>${l}</option>`).join('')}</select>${['text', 'url'].includes(b.type) ? `<textarea data-p="buttons.${i}.value" rows="2" maxlength="1500" style="margin-top:8px" placeholder="${b.type === 'url' ? 'https://...' : 'Javob matni'}">${esc(b.value)}</textarea>` : ''}</div>`).join('')}${c.buttons.length < 10 ? '<button class="addb" data-add="buttons">+ Tugma qo\'shish</button>' : ''}${saveBar()}`;
    } else if (tab === 'cat') {
      h = `<h4>Mahsulotlar</h4><p class="hint">Bot katalogida va mini ilovada ko'rinadi. Mijoz savatga qo'shib buyurtma beradi.</p>${c.products.map((x, i) => `<div class="it3"><div class="top3"><div style="display:flex;gap:10px;align-items:center"><div class="pimg" style="background-image:url('${esc(x.image)}')"></div><div><b>${esc(x.name || 'Yangi mahsulot')}</b><div class="sub3">${money(x.price)} ${esc(c.currency)}</div></div></div><button class="b d s" data-del="products" data-i="${i}">✕</button></div><input type="text" data-p="products.${i}.name" value="${esc(x.name)}" maxlength="100" placeholder="Nomi"><div class="row3" style="margin-top:8px"><input type="number" data-p="products.${i}.price" value="${esc(x.price)}" min="0" placeholder="Narxi"><input type="text" data-p="products.${i}.category" value="${esc(x.category)}" maxlength="40" placeholder="Kategoriya"></div><textarea data-p="products.${i}.description" rows="2" maxlength="500" style="margin-top:8px" placeholder="Tavsif">${esc(x.description)}</textarea><div style="display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap"><label class="upl" style="margin:0">Rasm yuklash<input type="file" accept="image/*" data-up="${i}" hidden></label><label class="sw mini" style="gap:8px"><span>Ko'rsatish</span><input type="checkbox" data-p="products.${i}.active" ${x.active !== false ? 'checked' : ''}><span class="tg"></span></label></div></div>`).join('')}<button class="addb" data-add="products">+ Mahsulot qo'shish</button>${saveBar()}`;
    } else if (tab === 'app') {
      const on = c.miniApp.enabled;
      h = `<h4>Telegram ichidagi mini do'kon</h4><p class="hint">Mini ilova bot ichida ochiladigan chiroyli do'kon: katalog, savat va buyurtma. Mahsulotlar «Katalog» bo'limidan olinadi.</p><label class="sw"><div><b>Mini ilovani yoqish</b><small>Botda «Do'kon» tugmasi va menyu tugmasi paydo bo'ladi</small></div><input type="checkbox" data-p="miniApp.enabled" ${on ? 'checked' : ''}><span class="tg"></span></label>
        ${fld('Tugma / ilova nomi', 'miniApp.title', { max: 40, ph: "Do'kon" })}<label class="f">Asosiy rang</label><input type="color" data-p="miniApp.accent" value="${esc(c.miniApp.accent)}" style="width:80px;height:40px">
        <h4>Havola</h4><div class="copy3"><input type="text" readonly value="${esc(B.appUrl)}"><button class="b g s" data-a="copy">Nusxa</button></div><p class="hint">Bu havolani @BotFather → /setmenubutton yoki /newapp orqali ham ulashingiz mumkin. «Saqlash» bosilganda bot menyu tugmasi avtomatik o'rnatiladi (HTTPS kerak).</p>${saveBar()}`;
    } else if (tab === 'rep') {
      h = `<h4>Avto-javoblar</h4><p class="hint">Mijoz xabarida kalit so'z bo'lsa, bot shu javobni yuboradi. Masalan: «narx» → narxlar ro'yxati.</p>${c.replies.map((r, i) => `<div class="it3"><div class="top3"><b>Javob ${i + 1}</b><button class="b d s" data-del="replies" data-i="${i}">✕</button></div><input type="text" data-p="replies.${i}.keyword" value="${esc(r.keyword)}" maxlength="40" placeholder="Kalit so'z"><textarea data-p="replies.${i}.answer" rows="3" maxlength="1200" style="margin-top:8px" placeholder="Javob">${esc(r.answer)}</textarea></div>`).join('')}<button class="addb" data-add="replies">+ Javob qo'shish</button>${saveBar()}`;
    } else if (tab === 'msg') {
      h = `<h4>Obunachilarga xabar yuborish</h4><div class="chk ok"><span>👥</span><span>Obunachilar: <b>${B.subscribers || 0}</b></span></div><label class="f">Xabar matni</label><textarea id="bcast" rows="6" maxlength="3000" placeholder="Masalan: Yangi mahsulotlar keldi! 🎉"></textarea><div class="hint">Soatiga 6 tagacha xabar yuborish mumkin. Spam qilmang: Telegram botni bloklashi mumkin.</div><button class="b" data-a="bcast" style="margin-top:8px">Yuborish</button>`;
    } else if (tab === 'ord') {
      h = `<h4>Bot buyurtmalari</h4>${orders.length ? orders.map((o) => `<div class="ord3"><b>#${esc(o.id)}</b> · ${esc(fmt(o.date))}<div>${esc(o.name)} · <a href="tel:${esc(String(o.phone).replace(/[^\d+]/g, ''))}">${esc(o.phone)}</a>${o.extra && o.extra.Telegram ? ' · ' + esc(o.extra.Telegram) : ''}</div><div style="color:var(--muted)">${(o.items || []).map((i) => `${esc(i.name)} × ${i.qty}`).join(', ')}</div>${o.message ? `<div>💬 ${esc(o.message)}</div>` : ''}<div><b>${money(o.total)} ${esc(c.currency)}</b></div></div>`).join('') : '<div class="empty">Hali buyurtma yo\'q</div>'}`;
    }
    p.innerHTML = h;
  }
  function drawPreview() {
    const c = B.config, pv = $('#prev3'); if (!pv) return;
    const rows = c.buttons.map((b) => `<span class="${b.type === 'webapp' ? 'wa' : ''}">${esc(b.text)}</span>`).join('') + (c.miniApp.enabled && !c.buttons.some((b) => b.type === 'webapp') ? `<span class="wa" style="grid-column:1/-1">🛍 ${esc(c.miniApp.title || "Do'kon")}</span>` : '');
    pv.innerHTML = `<div class="phone"><div class="ph-h"><div class="av">${esc((c.title || '?')[0].toUpperCase())}</div><div><b>${esc(c.title)}</b><small>bot</small></div></div>${tab === 'app' && c.miniApp.enabled ? `<iframe src="/app/${esc(B.id)}?preview=1" title="Mini ilova"></iframe>` : `<div class="ph-b"><div class="msg3 me">/start</div><div class="msg3">${esc(c.welcome)}</div></div><div class="ph-k">${rows}</div>`}</div>`;
  }
  const mark = () => { dirty = true; const s = $('#sv'); if (s) s.textContent = "O'zgarishlar saqlanmagan"; };
  async function saveCfg() {
    try { const r = await A.request('/api/my/bots/' + B.id, { method: 'PUT', body: { config: B.config } }); const subs = B.subscribers; B = r; B.subscribers = subs; dirty = false; drawPanel(); drawPreview(); toast(r.warn ? 'Saqlandi. ' + r.warn : 'Saqlandi'); }
    catch (e) { toast(e.message); }
  }
  function resize(file) {
    return new Promise((res, rej) => { const rd = new FileReader(); rd.onerror = () => rej(new Error("Fayl o'qilmadi")); rd.onload = () => { const im = new Image(); im.onerror = () => rej(new Error('Rasm ochilmadi')); im.onload = () => { const k = Math.min(1, 900 / Math.max(im.width, im.height)); const c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', 0.84)); }; im.src = rd.result; }; rd.readAsDataURL(file); });
  }

  document.addEventListener('click', async (e) => {
    const t = e.target.closest('button,a'); if (!t) return;
    if (t.id === 'newBot' || t.id === 'newBot2') return wizard();
    if (t.dataset.open) return openBot(t.dataset.open);
    if (t.id === 'back') { if (dirty && !confirm("Saqlanmagan o'zgarishlar yo'qoladi. Chiqasizmi?")) return; await loadList(); return; }
    if (t.dataset.t) { tab = t.dataset.t; drawTabs(); if (tab === 'ord') { try { orders = await A.request(`/api/my/bots/${B.id}/orders`); } catch (er) { toast(er.message); } } if (tab === 'msg') { try { B.subscribers = (await A.request('/api/my/bots/' + B.id)).subscribers; } catch (er) { /* ignore */ } } drawPanel(); drawPreview(); return; }
    if (t.dataset.add) { const k = t.dataset.add; B.config[k].push(k === 'buttons' ? { text: 'Yangi tugma', type: 'text', value: '' } : k === 'products' ? { id: '', name: '', price: 0, description: '', image: '', category: '', active: true } : { keyword: '', answer: '' }); mark(); drawPanel(); drawPreview(); return; }
    if (t.dataset.del) { B.config[t.dataset.del].splice(+t.dataset.i, 1); mark(); drawPanel(); drawPreview(); return; }
    const a = t.dataset.a; if (!a) return;
    if (a === 'save') return saveCfg();
    if (a === 'botbuy') { t.disabled = true; try { await saveCfg(); const j = await A.request(`/api/my/bots/${B.id}/checkout`, { method: 'POST', body: { method: t.dataset.m } }); if (j.paid) { B = await A.request('/api/my/bots/' + B.id); drawPanel(); return toast("To'langan"); } if (j.manual) { payInfo = j; drawPanel(); return; } if (j.payUrl) { location.href = j.payUrl; return; } } catch (er) { toast(er.message); t.disabled = false; } return; }
    if (a === 'paycheck') { try { const subs = B.subscribers; B = await A.request('/api/my/bots/' + B.id); B.subscribers = subs; if (!B.price.dueUsd) payInfo = null; drawPanel(); toast(B.price.dueUsd ? "To'lov hali tasdiqlanmadi" : "To'lov tasdiqlandi! Bot ishlayapti"); } catch (er) { toast(er.message); } return; }
    if (a === 'connect') { try { const r = await A.request(`/api/my/bots/${B.id}/connect`, { method: 'POST' }); B = r.bot; drawPanel(); toast(r.webhook ? 'Bot ulandi' : (r.warn || 'Ulanmadi')); } catch (er) { toast(er.message); } return; }
    if (a === 'del') { if (!confirm("Bot platformadan o'chirilsinmi? Katalog va sozlamalar yo'qoladi.")) return; try { await A.request('/api/my/bots/' + B.id, { method: 'DELETE' }); toast("O'chirildi"); await loadList(); } catch (er) { toast(er.message); } return; }
    if (a === 'copy') { try { await navigator.clipboard.writeText(B.appUrl); toast('Nusxa olindi'); } catch (er) { toast(B.appUrl); } return; }
    if (a === 'bcast') { const txt = $('#bcast').value.trim(); if (txt.length < 2) return toast('Xabar matnini yozing'); if (!confirm(`${B.subscribers || 0} ta obunachiga yuborilsinmi?`)) return; try { const r = await A.request(`/api/my/bots/${B.id}/broadcast`, { method: 'POST', body: { text: txt } }); toast(`Yuborilmoqda: ${r.total} ta obunachiga`); $('#bcast').value = ''; } catch (er) { toast(er.message); } }
  });
  document.addEventListener('input', (e) => {
    const el = e.target; if (!el.dataset || !el.dataset.p || !B) return;
    setv(B.config, el.dataset.p, el.type === 'checkbox' ? el.checked : el.type === 'number' ? Number(el.value) : el.value); mark(); drawPreview();
  });
  document.addEventListener('change', async (e) => {
    const el = e.target; if (!B) return;
    if (el.dataset && el.dataset.p && (el.tagName === 'SELECT' || el.type === 'checkbox')) { setv(B.config, el.dataset.p, el.type === 'checkbox' ? el.checked : el.value); mark(); drawPanel(); drawPreview(); }
    if (el.dataset && el.dataset.up !== undefined && el.files[0]) {
      try { const data = await resize(el.files[0]); const r = await A.request('/api/my/upload', { method: 'POST', body: { data } }); B.config.products[+el.dataset.up].image = r.url; mark(); drawPanel(); toast('Rasm yuklandi'); } catch (er) { toast(er.message); }
    }
  });
  addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
  const q = new URLSearchParams(location.search);
  await loadList(); if (q.get('b')) openBot(q.get('b'));
})();
</script>
<script src="/topnav.js" defer></script>
</body>
</html>
