<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>Impro IT panel</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#0e0d12);--bg2:var(--tg-theme-secondary-bg-color,#17151d);--ink:var(--tg-theme-text-color,#f1ece0);--mut:var(--tg-theme-hint-color,#8d8899);--acc:#c8a86a;--acc2:#e6d3a3;--on:#17110a;--ok:#34c38f;--warn:#f5a524;--bad:#ef5b5b;--line:color-mix(in srgb,var(--ink) 11%,transparent);--r:16px;--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;overscroll-behavior:none}
body{min-height:100vh;padding-bottom:calc(72px + var(--sb))}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 16px 10px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em;flex:1}header h1 small{display:block;font-size:12px;font-weight:500;color:var(--mut);letter-spacing:0}
.ic{width:38px;height:38px;border-radius:12px;background:var(--bg2);display:grid;place-items:center}.ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.ic.spin svg{animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
main{padding:12px 14px 0;max-width:720px;margin:0 auto}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--bg2);border-radius:var(--r);padding:14px;position:relative;overflow:hidden}.kpi.hot{background:linear-gradient(135deg,#c8a86a,#8e6f33);color:#fff}.kpi.hot small{color:#ffffffcc}
.kpi small{display:block;color:var(--mut);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}.kpi b{display:block;font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:4px}.kpi span{font-size:12px;color:var(--mut)}.kpi.hot span{color:#ffffffcc}
.card{background:var(--bg2);border-radius:var(--r);padding:14px;margin-top:10px}.card h3{margin:0 0 10px;font-size:15px}
.chart{display:flex;align-items:flex-end;gap:5px;height:96px}.chart i{flex:1;display:flex;align-items:flex-end;gap:1.5px;height:100%}.chart u{flex:1;border-radius:3px 3px 0 0;min-height:2px;background:var(--acc);text-decoration:none}.chart u.b{background:#6aa7e6}
.lg{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:8px}.lg b{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;background:var(--acc)}.lg b.b{background:#6aa7e6}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.mut{color:var(--mut);font-size:13px}
.item{background:var(--bg2);border-radius:var(--r);padding:13px 14px;margin-top:10px;content-visibility:auto;contain-intrinsic-size:auto 110px}
.item b{font-weight:650}.item .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:650;background:color-mix(in srgb,var(--mut) 20%,transparent);color:var(--ink);white-space:nowrap}
.pill.new{background:#f5a52430;color:var(--warn)}.pill.run{background:#4c8dff30;color:#6aa7ff}.pill.done,.pill.paid{background:#34c38f30;color:var(--ok)}.pill.bad{background:#ef5b5b30;color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:12px;background:var(--bg);font-weight:650;font-size:14px;border:1px solid var(--line)}.btn.p{background:linear-gradient(135deg,var(--acc2),var(--acc));color:var(--on);border:0}.btn:active{transform:scale(.97)}.btn[disabled]{opacity:.5}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.acts .btn{flex:1;min-width:110px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chips button{flex:none;padding:8px 14px;border-radius:99px;background:var(--bg2);font-size:13.5px;font-weight:600;color:var(--mut)}.chips button.on{background:var(--acc);color:var(--on)}
input.s{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);font:inherit;outline:0;margin-bottom:6px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + var(--sb));background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;border-radius:12px;color:var(--mut);font-size:11px;font-weight:600;position:relative}nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}nav button.on{color:var(--acc)}
nav .bd{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}
.sk{height:78px;border-radius:var(--r);margin-top:10px;background:linear-gradient(100deg,var(--bg2) 30%,color-mix(in srgb,var(--ink) 9%,var(--bg2)) 50%,var(--bg2) 70%);background-size:300% 100%;animation:sh 1.2s infinite}@keyframes sh{from{background-position:100% 0}to{background-position:0 0}}
.empty{text-align:center;color:var(--mut);padding:44px 20px}.err{background:#ef5b5b22;color:var(--bad);border-radius:var(--r);padding:14px;margin-top:10px;font-size:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg2);border-radius:12px;padding:3px;margin-bottom:6px}.seg button{padding:9px;border-radius:10px;font-weight:650;font-size:14px;color:var(--mut)}.seg button.on{background:var(--bg);color:var(--ink)}
.sheet{position:fixed;inset:0;z-index:20;background:#0009;display:none;align-items:flex-end}.sheet.on{display:flex}.sheet div{width:100%;background:var(--bg2);border-radius:20px 20px 0 0;padding:16px 14px calc(16px + var(--sb));animation:up .2s ease-out}@keyframes up{from{transform:translateY(30px);opacity:0}}.sheet h4{margin:0 0 10px;font-size:16px}.sheet button{display:block;width:100%;text-align:left;padding:14px;border-radius:12px;background:var(--bg);margin-top:8px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(86px + var(--sb));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:30;pointer-events:none;max-width:90vw}.toast.on{opacity:1;transform:translate(-50%,0)}
.fade{animation:fd .25s ease-out}@keyframes fd{from{opacity:0;transform:translateY(6px)}}
</style>
</head>
<body>
<header><h1>Impro IT<small id="sub">Yuklanmoqda…</small></h1><button class="ic" id="rf" aria-label="Yangilash"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg></button></header>
<main id="m"></main>
<nav id="nav"></nav>
<div class="sheet" id="sh"><div id="shc"></div></div>
<div class="toast" id="ts"></div>
<script>
(function(){
'use strict';
var tg=window.Telegram&&Telegram.WebApp,$=function(s){return document.querySelector(s)};
var ICON={dash:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',orders:'<path d="M5 7h14l-1.3 11H6.3z"/><path d="M9 7a3 3 0 0 1 6 0"/>',sites:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.3 3 14.7 0 18M12 3c-3 3.3-3 14.7 0 18"/>',cust:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c2 .7 3.2 2.4 3.5 5.2"/>',leads:'<path d="M4 5h16v11H8l-4 4z"/>'};
var TABS=[['dash','Bosh'],['orders','Buyurtma'],['sites','Saytlar'],['cust','Mijozlar'],['leads','Lidlar']];
var tab=sessionStorage.getItem('tab')||'dash',token=null,badges={},busy=0,seg='leads',filt='all',q='',data={};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var fmt=function(n){return String(Math.round(Number(n)||0)).replace(/\B(?=(\d{3})+(?!\d))/g,' ')};
var pad=function(n){return n<10?'0'+n:''+n};
var dt=function(t){var d=new Date((typeof t==='number'?t:Date.parse(t))+5*36e5);return isNaN(d)?'':pad(d.getUTCDate())+'.'+pad(d.getUTCMonth()+1)+' '+pad(d.getUTCHours())+':'+pad(d.getUTCMinutes())};
var hap=function(k){try{tg&&tg.HapticFeedback&&(k==='ok'?tg.HapticFeedback.notificationOccurred('success'):tg.HapticFeedback.impactOccurred('light'))}catch(e){}};
function toast(t){var e=$('#ts');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove('on')},2200)}
if(tg){try{tg.ready();tg.expand();tg.disableVerticalSwipes&&tg.disableVerticalSwipes();tg.setHeaderColor&&tg.setHeaderColor('secondary_bg_color')}catch(e){}}
/* ---- tarmoq ---- */
function auth(){return fetch('/api/adminbot/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:(tg&&tg.initData)||''})}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||'Kirish rad etildi');token=j.token;try{localStorage.setItem('mt',token)}catch(e){}return token})})}
function req(path,opt,retry){opt=opt||{};var ctl=new AbortController(),to=setTimeout(function(){ctl.abort()},15000);var h=Object.assign({'Authorization':'Bearer '+token},opt.body?{'Content-Type':'application/json'}:{}, opt.headers||{});
return fetch(path,{method:opt.method||'GET',headers:h,body:opt.body,signal:ctl.signal}).then(function(r){clearTimeout(to);if(r.status===401&&!retry)return auth().then(function(){return req(path,opt,1)});return r.json().then(function(j){if(!r.ok)throw new Error(j.error||'Xatolik');return j})},function(e){clearTimeout(to);throw new Error(e.name==='AbortError'?'Server javob bermadi. Qayta urinib ko\'ring.':'Internet aloqasi yo\'q')})}
var CK={};try{CK=JSON.parse(localStorage.getItem('mc')||'{}')}catch(e){}
function swr(key,path,opt,render){var c=CK[key];if(c){render(c,true)}else $('#m').innerHTML='<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
 busy++;spin(1);return req(path,opt).then(function(j){CK[key]=j;try{localStorage.setItem('mc',JSON.stringify(CK))}catch(e){}render(j,false);return j}).catch(function(e){if(!c)$('#m').innerHTML='<div class="err">'+esc(e.message)+'<div class="acts"><button class="btn" id="rt">Qayta urinish</button></div></div>';else toast(e.message)}).then(function(){busy--;if(!busy)spin(0)})}
function spin(on){$('#rf').classList.toggle('spin',!!on);$('#sub').textContent=on?'Yangilanmoqda…':'Yangilandi '+pad(new Date().getHours())+':'+pad(new Date().getMinutes())}
/* ---- ko'rinishlar ---- */
function nav(){$('#nav').innerHTML=TABS.map(function(t){return'<button data-t="'+t[0]+'" class="'+(t[0]===tab?'on':'')+'"><svg viewBox="0 0 24 24">'+ICON[t[0]]+'</svg>'+t[1]+(badges[t[0]]?'<span class="bd">'+badges[t[0]]+'</span>':'')+'</button>'}).join('')}
var ST={yangi:['Yangi','new'],jarayonda:['Jarayonda','run'],bajarildi:['Bajarildi','done'],bekor:['Bekor','bad']},TY={order:'Buyurtma',brief:'Loyiha',booking:'Ariza',message:'Xabar'};
function vDash(s){var days=s.orders.series.length,mx=Math.max(1,Math.max.apply(null,s.orders.series.concat(s.users.series)));badges.orders=s.orders.new||0;badges.sites=s.projects.submitted||0;nav();
 var bars=s.orders.series.map(function(v,i){return'<i><u style="height:'+Math.max(3,v/mx*100)+'%" title="'+v+'"></u><u class="b" style="height:'+Math.max(3,s.users.series[i]/mx*100)+'%"></u></i>'}).join('');
 var r=data.orders5||[];
 $('#m').innerHTML='<div class="kpis fade"><div class="kpi hot"><small>Sotuvlar</small><b>$'+fmt(s.revenue.usd)+'</b><span>'+s.projects.paid+' ta sotilgan</span></div><div class="kpi"><small>Yangi buyurtma</small><b>'+s.orders.new+'</b><span>jami '+s.orders.total+' ta</span></div><div class="kpi"><small>Mijozlar</small><b>'+s.users.total+'</b><span>ro\'yxatdan o\'tgan</span></div><div class="kpi"><small>Sayt so\'rovlari</small><b>'+s.projects.submitted+'</b><span>jami '+s.projects.total+' ta sayt</span></div></div>'
 +'<div class="card fade"><h3>So\'nggi '+days+' kun</h3><div class="chart">'+bars+'</div><div class="lg"><span><b></b>Buyurtma</span><span><b class="b"></b>Yangi mijoz</span></div></div>'
 +'<div class="card fade"><div class="row"><h3>Buyurtmalar summasi</h3><b>'+fmt(s.orders.sum)+' so\'m</b></div><div class="mut">Bekor qilinmaganlar bo\'yicha</div></div>'
 +(r.length?'<h3 style="margin:16px 4px 0;font-size:15px">Oxirgi buyurtmalar</h3>'+r.map(oCard).join(''):'')}
function oCard(o){var st=ST[o.status||'yangi']||ST.yangi;return'<div class="item" data-o="'+esc(o.id)+'"><div class="row"><b>'+esc(o.name)+'</b><span class="pill '+st[1]+'">'+st[0]+'</span></div><div class="mut">'+dt(o.date)+' · '+esc(TY[o.type]||o.type)+(o.total?' · '+fmt(o.total)+' so\'m':'')+'</div>'
 +(o.items&&o.items.length?'<div class="mut" style="margin-top:6px">'+o.items.slice(0,3).map(function(i){return esc(i.name)+' ×'+i.qty}).join(', ')+'</div>':'')+(o.message?'<div style="margin-top:6px;font-size:14px">'+esc(String(o.message).slice(0,160))+'</div>':'')
 +'<div class="acts"><a class="btn" href="tel:'+esc(o.phone)+'">📞 '+esc(o.phone)+'</a><button class="btn" data-st="'+esc(o.id)+'">Holat</button></div></div>'}
function vOrders(list){data.orders=list;var f=list.filter(function(o){return filt==='all'||(o.status||'yangi')===filt});
 $('#m').innerHTML='<div class="chips" id="ch">'+[['all','Hammasi'],['yangi','Yangi'],['jarayonda','Jarayonda'],['bajarildi','Bajarildi'],['bekor','Bekor']].map(function(c){var n=c[0]==='all'?list.length:list.filter(function(o){return(o.status||'yangi')===c[0]}).length;return'<button data-f="'+c[0]+'" class="'+(filt===c[0]?'on':'')+'">'+c[1]+' '+n+'</button>'}).join('')+'</div>'+(f.length?f.map(oCard).join(''):'<div class="empty">Buyurtma yo\'q</div>')}
function vSites(list){data.sites=list;badges.sites=list.filter(function(p){return !p.paid&&p.status==='yuborilgan'}).length;nav();
 $('#m').innerHTML=list.length?list.map(function(p){return'<div class="item"><div class="row"><b>'+esc(p.name)+'</b><span class="pill '+(p.paid?'paid':'new')+'">'+(p.paid?'To\'langan':'To\'lanmagan')+'</span></div><div class="mut">'+esc(p.user?p.user.name:'')+' · '+esc(p.user?p.user.phone:'')+'</div><div class="meta"><span class="pill">'+esc(p.status)+'</span>'+(p.published?'<span class="pill done">Joylangan</span>':'')+'</div><div class="acts">'+(p.user?'<a class="btn" href="tel:'+esc(p.user.phone)+'">📞 Qo\'ng\'iroq</a>':'')+(p.published&&p.url?'<button class="btn" data-open="'+esc(p.url)+'">Saytni ochish</button>':'')+(p.paid?'':'<button class="btn p" data-paid="'+esc(p.id)+'">✅ To\'lovni tasdiqlash</button>')+'</div></div>'}).join(''):'<div class="empty">Mijoz saytlari yo\'q</div>'}
function vCust(list){data.cust=list;$('#m').innerHTML='<input class="s" id="q" placeholder="Qidirish (ism, telefon)…" value="'+esc(q)+'" autocomplete="off"><div id="cl"></div>';drawCust()}
function drawCust(){var l=(data.cust||[]).filter(function(u){var s=(u.name+' '+u.phone+' '+(u.email||'')).toLowerCase();return !q||s.indexOf(q.toLowerCase())>-1});$('#cl').innerHTML=l.length?l.map(function(u){return'<div class="item"><div class="row"><b>'+esc(u.name)+'</b><span class="mut">'+dt(u.createdAt)+'</span></div><div class="mut">'+esc(u.email||'')+'</div><div class="meta"><span class="pill">Saytlar '+u.projects+'</span><span class="pill">Buyurtma '+u.orders+'</span></div><div class="acts"><a class="btn" href="tel:'+esc(u.phone)+'">📞 '+esc(u.phone)+'</a></div></div>'}).join(''):'<div class="empty">Topilmadi</div>'}
function vLeads(j){var segh='<div class="seg"><button data-s="leads" class="'+(seg==='leads'?'on':'')+'">Lidlar</button><button data-s="book" class="'+(seg==='book'?'on':'')+'">Uchrashuv</button></div>';
 if(seg==='leads'){var l=j.leads||[];$('#m').innerHTML=segh+(l.length?l.map(function(x){return'<div class="item"><div class="row"><b>'+esc(x.n||'Mijoz')+'</b><span class="mut">'+dt(x.t)+'</span></div><div class="mut">'+esc(x.s||'')+(x.g?' · '+esc(x.g):'')+'</div>'+(x.x?'<div style="margin-top:6px;font-size:14px">'+esc(String(x.x).slice(0,200))+'</div>':'')+(x.p?'<div class="acts"><a class="btn" href="tel:'+esc(x.p)+'">📞 '+esc(x.p)+'</a></div>':'')+'</div>'}).join(''):'<div class="empty">Lid yo\'q</div>')}
 else{var b=j.bookings||[];$('#m').innerHTML=segh+(b.length?b.map(function(x){return'<div class="item"><div class="row"><b>'+dt(x.at)+'</b><span class="mut">Toshkent</span></div>'+esc(x.n)+'<div class="acts"><a class="btn" href="tel:'+esc(x.p)+'">📞 '+esc(x.p)+'</a></div></div>'}).join(''):'<div class="empty">Yaqin uchrashuvlar yo\'q</div>')}}
function load(){nav();sessionStorage.setItem('tab',tab);
 if(tab==='dash'){req('/api/admin/orders?limit=5').then(function(o){data.orders5=o;if(CK.stats)vDash(CK.stats)}).catch(function(){});return swr('stats','/api/admin/stats',0,function(s){vDash(s)})}
 if(tab==='orders')return swr('orders','/api/admin/orders?limit=80',0,vOrders);
 if(tab==='sites')return swr('sites','/api/admin/projects',0,vSites);
 if(tab==='cust')return swr('cust','/api/admin/users',0,vCust);
 if(tab==='leads')return swr('l'+seg,'/api/app',{method:'POST',body:JSON.stringify({action:seg==='leads'?'leads':'bookings'}),headers:{'X-Init-Data':(tg&&tg.initData)||''}},vLeads)}
/* ---- hodisalar ---- */
function sheet(h){$('#shc').innerHTML=h;$('#sh').classList.add('on')}function closeSheet(){$('#sh').classList.remove('on')}
document.addEventListener('click',function(e){var t=e.target.closest('[data-t],[data-f],[data-s],[data-st],[data-ns],[data-paid],[data-open],#rf,#rt');if(!t){if(e.target.id==='sh')closeSheet();return}
 if(t.dataset.t){tab=t.dataset.t;hap();load();window.scrollTo(0,0)}
 else if(t.dataset.f){filt=t.dataset.f;hap();vOrders(data.orders||[])}
 else if(t.dataset.s){seg=t.dataset.s;hap();load()}
 else if(t.dataset.st){var id=t.dataset.st;sheet('<h4>Buyurtma holati</h4>'+Object.keys(ST).map(function(k){return'<button data-ns="'+id+'|'+k+'">'+ST[k][0]+'</button>'}).join(''))}
 else if(t.dataset.ns){var p=t.dataset.ns.split('|');closeSheet();setStatus(p[0],p[1])}
 else if(t.dataset.paid){var pid=t.dataset.paid;var go=function(){t.disabled=true;req('/api/admin/projects/'+pid,{method:'PUT',body:JSON.stringify({paid:true})}).then(function(){hap('ok');toast('To\'lov tasdiqlandi ✅');delete CK.sites;delete CK.stats;load()}).catch(function(er){t.disabled=false;toast(er.message)})};tg&&tg.showConfirm?tg.showConfirm('Mijoz to\'lovni amalga oshirganini tasdiqlaysizmi?',function(ok){ok&&go()}):go()}
 else if(t.dataset.open){tg&&tg.openLink?tg.openLink(t.dataset.open):window.open(t.dataset.open)}
 else if(t.id==='rf'||t.id==='rt'){hap();delete CK[tab==='leads'?'l'+seg:tab];load()}});
document.addEventListener('input',function(e){if(e.target.id==='q'){q=e.target.value;clearTimeout(drawCust.t);drawCust.t=setTimeout(drawCust,80)}});
function setStatus(id,st){var l=data.orders||[];l.forEach(function(o){if(o.id===id)o.status=st});if(CK.orders)CK.orders=l;vOrders(l);req('/api/admin/orders',{method:'PUT',body:JSON.stringify({id:id,status:st})}).then(function(){hap('ok');toast('Saqlandi');delete CK.stats}).catch(function(er){toast(er.message);delete CK.orders;load()})}
var last=Date.now();document.addEventListener('visibilitychange',function(){if(!document.hidden&&Date.now()-last>30000&&token){last=Date.now();load()}});
/* ---- boshlash ---- */
